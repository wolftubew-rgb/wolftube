<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WolfTube • Conteúdo +18</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: white;
            overflow: hidden;
        }

        /* TELA DE VERIFICAÇÃO DE IDADE */
        .age-verification {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .age-container {
            background: linear-gradient(135deg, #1e1e2e, #16213e);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid rgba(255,107,107,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { border-color: rgba(255,107,107,0.3); box-shadow: 0 0 0px rgba(255,107,107,0); }
            50% { border-color: rgba(255,107,107,0.8); box-shadow: 0 0 20px rgba(255,107,107,0.3); }
            100% { border-color: rgba(255,107,107,0.3); box-shadow: 0 0 0px rgba(255,107,107,0); }
        }

        .age-icon { font-size: 80px; margin-bottom: 20px; }
        .age-container h1 {
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 32px;
            margin-bottom: 15px;
        }
        .age-warning {
            background: rgba(255,107,107,0.15);
            border-left: 3px solid #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            color: #ff8888;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .age-text {
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .age-buttons { display: flex; gap: 20px; justify-content: center; }
        .age-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .age-btn.yes { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .age-btn.yes:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(46,204,113,0.4); }
        .age-btn.no { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .age-btn.no:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(231,76,60,0.4); }

        .main-content { display: none; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 56px;
            position: fixed;
            width: 100%;
            top: 0;
            background-color: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid #272727;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-emoji { font-size: 28px; background: none; color: white; }
        .header-icons { display: flex; gap: 15px; align-items: center; }

        .sidebar {
            position: fixed;
            left: 0;
            top: 56px;
            width: 240px;
            height: calc(100vh - 56px);
            background-color: #0f0f0f;
            overflow-y: auto;
            padding: 12px 0;
            z-index: 999;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 8px 24px;
            cursor: pointer;
            border-radius: 10px;
            margin: 2px 8px;
        }
        .sidebar-item:hover { background-color: #272727; }
        hr { margin: 12px 0; border-color: #333; }

        main {
            margin-top: 56px;
            margin-left: 240px;
            padding: 20px 24px;
            height: calc(100vh - 56px);
            overflow-y: auto;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px 16px;
        }

        .video-card { cursor: pointer; transition: transform 0.2s; position: relative; }
        .video-card:hover { transform: scale(0.98); }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }

        .video-text h3 {
            font-size: 16px;
            line-height: 22px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta { font-size: 14px; color: #aaa; }

        .contador {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-family: monospace;
            border: 1px solid #ff6b6b;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            main { margin-left: 0; }
        }
    </style>
</head>
<body>

<!-- TELA DE VERIFICAÇÃO DE IDADE -->
<div id="ageVerification" class="age-verification">
    <div class="age-container">
        <div class="age-icon">🔞</div>
        <h1>WolfTube</h1>
        <p class="age-text">⚠️ <strong>CONTEÚDO EXCLUSIVO PARA MAIORES DE 18 ANOS</strong> ⚠️</p>
        <p class="age-text">Este site contém vídeos que podem não ser apropriados para menores de idade.</p>
        <div class="age-warning">🔞 VOCÊ CONFIRMA QUE TEM 18 ANOS OU MAIS PARA ACESSAR ESTE CONTEÚDO? 🔞</div>
        <div class="age-buttons">
            <button class="age-btn yes" id="ageYesBtn">✅ SIM, TENHO 18 ANOS OU MAIS</button>
            <button class="age-btn no" id="ageNoBtn">❌ NÃO, SOU MENOR DE 18</button>
        </div>
    </div>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="main-content" id="mainContentWrap">
<header>
    <div class="logo" id="homeButton"><span class="logo-emoji">🐺</span><span>WolfTube</span></div>
    <div class="header-icons">
        <div id="authButton"><button class="login-btn" id="loginBtn">🔑 Entrar</button></div>
    </div>
</header>

<div class="sidebar">
    <div class="sidebar-item" id="homeSidebar">🏠 Início</div>
    <hr>
    <div class="sidebar-item" id="configSidebar">⚙️ Configurações</div>
</div>

<main id="mainContent">
    <div class="video-grid" id="videoGrid"></div>
</main>

<div class="contador" id="contador">📹 0 vídeos</div>
</div>

<script>
    // VÍDEOS DE EXEMPLO
    let videosData = [
        { id: 1, title: "🎬 Vídeo Exclusivo 1", views: "1.2K visualizações", thumbnail: "https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" },
        { id: 2, title: "🎬 Vídeo Exclusivo 2", views: "892 visualizações", thumbnail: "https://img.youtube.com/vi/9bZkp7q19f0/maxresdefault.jpg" },
        { id: 3, title: "🎬 Vídeo Exclusivo 3", views: "2.1K visualizações", thumbnail: "https://img.youtube.com/vi/3JZ_D3ELwOQ/maxresdefault.jpg" }
    ];

    function renderizarVideos() {
        const grid = document.getElementById('videoGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        for (let video of videosData) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail">
                    <img src="${video.thumbnail}" onerror="this.src='https://via.placeholder.com/300x169?text=WolfTube+18'">
                    <span style="position:absolute; bottom:5px; right:5px; background:#ff6b6b; color:white; font-size:10px; padding:2px 6px; border-radius:20px;">🔞 +18</span>
                </div>
                <div class="video-text">
                    <h3>${video.title}</h3>
                    <p class="video-meta">${video.views}</p>
                </div>
            `;
            grid.appendChild(card);
        }
        document.getElementById('contador').innerHTML = `📹 ${videosData.length} vídeos +18`;
    }

    // VERIFICAÇÃO DE IDADE
    function confirmarMaiorIdade() {
        localStorage.setItem('wolfTube_ageConfirmed', 'true');
        document.getElementById('ageVerification').style.display = 'none';
        document.getElementById('mainContentWrap').style.display = 'block';
        renderizarVideos();
    }

    function negarMaiorIdade() {
        document.getElementById('ageVerification').innerHTML = `
            <div class="age-container">
                <div class="age-icon">🚫</div>
                <h1>Acesso Negado</h1>
                <p class="age-text">❌ <strong>ACESSO BLOQUEADO</strong> ❌</p>
                <p class="age-text">Este site é restrito para maiores de 18 anos.</p>
                <div class="age-warning">⚠️ Você não tem idade suficiente para acessar este conteúdo.</div>
                <div class="age-buttons">
                    <button class="age-btn yes" id="tryAgainBtn">🔙 VOLTAR E CONFIRMAR IDADE</button>
                </div>
            </div>
        `;
        document.getElementById('tryAgainBtn')?.addEventListener('click', () => location.reload());
    }

    document.getElementById('ageYesBtn')?.addEventListener('click', confirmarMaiorIdade);
    document.getElementById('ageNoBtn')?.addEventListener('click', negarMaiorIdade);
    
    // Verificar se já confirmou antes
    if (localStorage.getItem('wolfTube_ageConfirmed') === 'true') {
        document.getElementById('ageVerification').style.display = 'none';
        document.getElementById('mainContentWrap').style.display = 'block';
        renderizarVideos();
    }
</script>
</body>
</html>
