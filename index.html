<script>
    // ==================== CONFIGURAÇÃO DO GOOGLE DRIVE ====================
    const CLIENT_ID = '367616920639-pi7tcbr6sdqvrikechge2hd56unrmp9f.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyCTzXUHDyBMHklPb7biw8m8mRbrfj1YxFM';
    
    let tokenClient = null;
    let accessToken = null;
    let isGoogleConnected = false;
    let selectedVideoFile = null;
    let currentUser = null;
    let currentCreator = null;
    let videosData = [];
    let nextId = 1;
    let commentsData = {};
    let likesData = {};
    let dislikesData = {};
    let modoGaleria = false;
    let tipoLoginSelecionado = "usuario";
    let activeTab = "upload";
    
    const SENHA_ADMIN = "wolfadmin2010";
    const EMAIL_ADMIN = "admin@wolftube.com";
    
    function showMessage(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-message' + (isError ? ' toast-error' : '');
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Inicializar Google API
    function initGoogleAPI() {
        if (typeof gapi !== 'undefined') {
            gapi.load('client', () => {
                gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
            });
        }
    }
    
    function initGIS() {
        if (typeof google !== 'undefined' && google.accounts) {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (tokenResponse) => {
                    if (tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        isGoogleConnected = true;
                        document.getElementById('googleDriveStatus').innerHTML = '✅ Conectado!';
                        document.getElementById('googleDriveStatus').style.color = '#2ecc71';
                        document.getElementById('videoFileUpload').disabled = false;
                        showMessage('✅ Google Drive conectado!');
                    }
                },
            });
        }
    }
    
    function connectGoogleDrive() {
        if (tokenClient) {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        } else {
            initGIS();
            setTimeout(() => { if (tokenClient) tokenClient.requestAccessToken({ prompt: 'consent' }); }, 500);
        }
    }
    
    function uploadToGoogleDrive(file, title, onProgress) {
        return new Promise((resolve, reject) => {
            if (!accessToken) { reject('Google Drive não conectado'); return; }
            const metadata = { name: title + '.mp4', mimeType: file.type || 'video/mp4' };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
            form.append('file', file);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');
            xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
            xhr.upload.onprogress = (event) => { if (event.lengthComputable && onProgress) onProgress((event.loaded/event.total)*100); };
            xhr.onload = () => {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    resolve(`https://drive.google.com/file/d/${data.id}/preview`);
                } else { reject('Erro no upload'); }
            };
            xhr.onerror = () => reject('Erro de conexão');
            xhr.send(form);
        });
    }
    
    // Gerenciar criadores
    function carregarCriadores() { return JSON.parse(localStorage.getItem('wolfTube_creators') || '{}'); }
    function salvarCriadores(creators) { localStorage.setItem('wolfTube_creators', JSON.stringify(creators)); }
    
    function registrarCriador(nome, senha) {
        if (!nome || !senha) { showMessage("❌ Preencha todos os campos!", true); return false; }
        const creators = carregarCriadores();
        if (creators[nome]) { showMessage("❌ Este nome já existe!", true); return false; }
        creators[nome] = { nome, senha, criadoEm: new Date().toISOString(), videosIds: [] };
        salvarCriadores(creators);
        showMessage(`✅ Conta de criador "${nome}" criada!`);
        return true;
    }
    
    function loginCriador(nome, senha) {
        const creators = carregarCriadores();
        if (creators[nome] && creators[nome].senha === senha) {
            currentCreator = { nome, videosIds: creators[nome].videosIds || [], isAdmin: false };
            currentUser = null;
            localStorage.setItem('wolfTube_currentCreator', JSON.stringify(currentCreator));
            localStorage.removeItem('wolfTube_currentUser');
            atualizarUI();
            showMessage(`🎬 Bem-vindo, criador ${nome}!`);
            return true;
        }
        showMessage("❌ Nome ou senha incorretos!", true);
        return false;
    }
    
    function logoutCriador() {
        currentCreator = null;
        modoGaleria = false;
        localStorage.removeItem('wolfTube_currentCreator');
        atualizarUI();
        renderizarVideos();
        showMessage('🔓 Logout efetuado!');
    }
    
    function adicionarVideoAoCriador(videoId) {
        if (!currentCreator) return;
        const creators = carregarCriadores();
        if (creators[currentCreator.nome]) {
            if (!creators[currentCreator.nome].videosIds) creators[currentCreator.nome].videosIds = [];
            if (!creators[currentCreator.nome].videosIds.includes(videoId)) {
                creators[currentCreator.nome].videosIds.push(videoId);
                currentCreator.videosIds = creators[currentCreator.nome].videosIds;
                localStorage.setItem('wolfTube_currentCreator', JSON.stringify(currentCreator));
                salvarCriadores(creators);
            }
        }
    }
    
    function getVideosDoCriador() {
        if (!currentCreator) return [];
        return videosData.filter(video => currentCreator.videosIds.includes(video.id));
    }
    
    // Gerenciar usuários
    function carregarUsuarios() { return JSON.parse(localStorage.getItem('wolfTube_users') || '{}'); }
    function salvarUsuarios(users) { localStorage.setItem('wolfTube_users', JSON.stringify(users)); }
    
    function registrarUsuario(email, nome, senha) {
        if (!email || !nome || !senha) { showMessage("❌ Preencha todos os campos!", true); return false; }
        const users = carregarUsuarios();
        if (users[email]) { showMessage("❌ Este email já existe!", true); return false; }
        users[email] = { email, nome, senha, isAdmin: false, criadoEm: new Date().toISOString() };
        salvarUsuarios(users);
        showMessage(`✅ Conta de usuário "${nome}" criada!`);
        return true;
    }
    
    function loginUsuario(email, senha) {
        if (email === EMAIL_ADMIN && senha === SENHA_ADMIN) {
            currentUser = { email, nome: "Administrador", isAdmin: true };
            currentCreator = null;
            localStorage.setItem('wolfTube_currentUser', JSON.stringify(currentUser));
            localStorage.removeItem('wolfTube_currentCreator');
            atualizarUI();
            showMessage(`👑 Login ADMIN efetuado!`);
            return true;
        }
        const users = carregarUsuarios();
        if (users[email] && users[email].senha === senha) {
            currentUser = { email, nome: users[email].nome, isAdmin: false };
            currentCreator = null;
            localStorage.setItem('wolfTube_currentUser', JSON.stringify(currentUser));
            localStorage.removeItem('wolfTube_currentCreator');
            atualizarUI();
            showMessage(`👤 Bem-vindo, ${users[email].nome}!`);
            return true;
        }
        showMessage("❌ Email ou senha incorretos!", true);
        return false;
    }
    
    function logoutUsuario() {
        currentUser = null;
        localStorage.removeItem('wolfTube_currentUser');
        atualizarUI();
        renderizarVideos();
        showMessage('🔓 Logout efetuado!');
    }
    
    function carregarUsuarioAtual() {
        const savedUser = localStorage.getItem('wolfTube_currentUser');
        const savedCreator = localStorage.getItem('wolfTube_currentCreator');
        if (savedCreator) { currentCreator = JSON.parse(savedCreator); currentUser = null; }
        else if (savedUser) { currentUser = JSON.parse(savedUser); currentCreator = null; }
        atualizarUI();
    }
    
    function isAdmin() { return currentUser && currentUser.isAdmin === true; }
    
    // Login modal
    function abrirLoginModal() {
        document.getElementById('loginModal').style.display = 'flex';
        tipoLoginSelecionado = "usuario";
        atualizarFormularioLogin();
    }
    
    function fecharLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    
    function atualizarFormularioLogin() {
        const formArea = document.getElementById('loginFormArea');
        if (tipoLoginSelecionado === "usuario") {
            formArea.innerHTML = `
                <div class="input-group"><input type="email" id="loginEmail" class="input-field" placeholder="Seu email"></div>
                <div class="input-group"><input type="text" id="loginNome" class="input-field" placeholder="Seu nome"></div>
                <div class="input-group"><input type="password" id="loginSenha" class="input-field" placeholder="Sua senha"></div>
                <button id="loginSubmitBtn" class="login-submit-btn">🔓 Entrar</button>
                <button id="registerSubmitBtn" class="register-btn">✨ Criar conta</button>
            `;
            document.getElementById('loginSubmitBtn')?.onclick = () => {
                const email = document.getElementById('loginEmail').value.trim();
                const senha = document.getElementById('loginSenha').value;
                if (loginUsuario(email, senha)) fecharLoginModal();
            };
            document.getElementById('registerSubmitBtn')?.onclick = () => {
                const email = document.getElementById('loginEmail').value.trim();
                const nome = document.getElementById('loginNome').value.trim();
                const senha = document.getElementById('loginSenha').value;
                registrarUsuario(email, nome, senha);
            };
        } else {
            formArea.innerHTML = `
                <div class="input-group"><input type="text" id="creatorNome" class="input-field" placeholder="Nome de criador"></div>
                <div class="input-group"><input type="password" id="creatorSenha" class="input-field" placeholder="Senha"></div>
                <button id="creatorLoginBtn" class="login-submit-btn">🎬 Entrar</button>
                <button id="creatorRegisterBtn" class="register-btn">✨ Criar conta</button>
            `;
            document.getElementById('creatorLoginBtn')?.onclick = () => {
                const nome = document.getElementById('creatorNome').value.trim();
                const senha = document.getElementById('creatorSenha').value;
                if (loginCriador(nome, senha)) fecharLoginModal();
            };
            document.getElementById('creatorRegisterBtn')?.onclick = () => {
                const nome = document.getElementById('creatorNome').value.trim();
                const senha = document.getElementById('creatorSenha').value;
                registrarCriador(nome, senha);
            };
        }
    }
    
    document.getElementById('opcaoUsuario')?.onclick = () => { tipoLoginSelecionado = "usuario"; atualizarFormularioLogin(); };
    document.getElementById('opcaoCriador')?.onclick = () => { tipoLoginSelecionado = "criador"; atualizarFormularioLogin(); };
    
    // Vídeos
    const VIDEOS_INICIAIS = [
        { id: 1, embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", title: "🎬 Vídeo Exemplo", views: "1K visualizações", description: "Conteúdo exclusivo! 🔞", thumbnail: "https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg", autor: "", isUpload: false }
    ];
    
    function carregarVideos() {
        const salvos = localStorage.getItem('wolfTube_videos');
        if (salvos) {
            try { videosData = JSON.parse(salvos); nextId = Math.max(...videosData.map(v => v.id || 0), 0) + 1; }
            catch(e) { videosData = [...VIDEOS_INICIAIS]; nextId = 2; }
        } else { videosData = [...VIDEOS_INICIAIS]; nextId = 2; }
        atualizarContador();
    }
    
    function salvarVideos() { localStorage.setItem('wolfTube_videos', JSON.stringify(videosData)); atualizarContador(); }
    
    function atualizarContador() {
        const contador = document.getElementById('contador');
        if (contador) {
            if (modoGaleria && currentCreator) contador.innerHTML = `🎬 ${getVideosDoCriador().length} vídeos`;
            else contador.innerHTML = `📹 ${videosData.length} vídeos`;
        }
    }
    
    // Comentários
    function carregarComentarios() { commentsData = JSON.parse(localStorage.getItem('wolfTube_comments') || '{}'); }
    function salvarComentarios() { localStorage.setItem('wolfTube_comments', JSON.stringify(commentsData)); }
    
    function adicionarComentario(videoId, texto) {
        if (!currentUser && !currentCreator) { showMessage("🔐 Faça login!", true); return false; }
        if (!texto.trim()) { showMessage("❌ Digite um comentário!", true); return false; }
        let nome = currentUser ? currentUser.nome : currentCreator.nome;
        if (!commentsData[videoId]) commentsData[videoId] = [];
        commentsData[videoId].unshift({ id: Date.now(), autor: nome, texto: texto.trim(), data: new Date().toISOString() });
        salvarComentarios();
        exibirComentarios(videoId);
        showMessage("✅ Comentário publicado!");
        return true;
    }
    
    function exibirComentarios(videoId) {
        const commentsList = document.getElementById('commentsList');
        const commentsCountSpan = document.getElementById('commentsCount');
        const comentarios = commentsData[videoId] || [];
        commentsCountSpan.innerText = comentarios.length;
        if (comentarios.length === 0) { commentsList.innerHTML = '<div class="no-comments">Nenhum comentário ainda.</div>'; return; }
        commentsList.innerHTML = '';
        for (let c of comentarios) {
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `<div><span class="comment-author">${escapeHtml(c.autor)}</span><span class="comment-date">${new Date(c.data).toLocaleDateString()}</span></div><div class="comment-text">${escapeHtml(c.texto)}</div>`;
            commentsList.appendChild(div);
        }
    }
    
    // Likes
    function carregarLikes() { likesData = JSON.parse(localStorage.getItem('wolfTube_likes') || '{}'); dislikesData = JSON.parse(localStorage.getItem('wolfTube_dislikes') || '{}'); }
    function salvarLikes() { localStorage.setItem('wolfTube_likes', JSON.stringify(likesData)); localStorage.setItem('wolfTube_dislikes', JSON.stringify(dislikesData)); }
    
    function atualizarUIlikes(videoId) {
        document.getElementById('likeCount').innerText = likesData[videoId] || 0;
        document.getElementById('dislikeCount').innerText = dislikesData[videoId] || 0;
    }
    
    // Publicar vídeo
    async function publicarVideo() {
        if (!currentCreator) { showMessage("❌ Faça login como criador!", true); return; }
        if (!selectedVideoFile) { showMessage("❌ Selecione um vídeo!", true); return; }
        if (!isGoogleConnected) { showMessage("❌ Conecte ao Google Drive primeiro! Clique em 'Conectar Google'", true); return; }
        
        const titulo = document.getElementById('videoTitleUpload').value.trim() || "Meu Vídeo";
        const descricao = document.getElementById('videoDescUpload').value.trim() || "📹 Vídeo enviado";
        const videoId = nextId++;
        
        showMessage('⏳ Enviando para o Google Drive...');
        const progressDiv = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('uploadProgressBar');
        progressDiv.style.display = 'block';
        progressBar.style.width = '0%';
        
        try {
            const videoLink = await uploadToGoogleDrive(selectedVideoFile, titulo, (p) => { progressBar.style.width = p + '%'; });
            const novoVideo = {
                id: videoId,
                embedUrl: videoLink,
                title: titulo,
                views: "0 visualizações",
                description: descricao,
                thumbnail: 'https://via.placeholder.com/300x169?text=WolfTube',
                autor: currentCreator.nome,
                isUpload: true
            };
            videosData.unshift(novoVideo);
            adicionarVideoAoCriador(videoId);
            salvarVideos();
            progressDiv.style.display = 'none';
            progressBar.style.width = '0%';
            document.getElementById('uploadModal').style.display = 'none';
            selectedVideoFile = null;
            document.getElementById('videoPreviewArea').style.display = 'none';
            document.getElementById('videoTitleUpload').value = '';
            document.getElementById('videoDescUpload').value = '';
            document.getElementById('videoFileUpload').value = '';
            renderizarVideos();
            showMessage(`✅ Vídeo publicado com sucesso!`);
        } catch(error) {
            progressDiv.style.display = 'none';
            showMessage('❌ Erro no upload: ' + error, true);
        }
    }
    
    function abrirUploadModal() {
        if (!currentCreator) { showMessage("❌ Faça login como CRIADOR!", true); return; }
        document.getElementById('uploadModal').style.display = 'flex';
    }
    
    // Renderizar vídeos
    function renderizarVideos() {
        const grid = document.getElementById('videoGrid');
        if (!grid) return;
        grid.innerHTML = '';
        let videosParaExibir = modoGaleria && currentCreator ? getVideosDoCriador() : videosData;
        if (videosParaExibir.length === 0) {
            grid.innerHTML = '<div style="text-align:center;padding:50px;color:#aaa;">🎬 Nenhum vídeo disponível.</div>';
            return;
        }
        for (let video of videosParaExibir) {
            const thumbnail = video.thumbnail || 'https://via.placeholder.com/300x169?text=WolfTube';
            const commentsCount = (commentsData[video.id] || []).length;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="thumbnail" onclick="abrirVideo(${video.id})">
                    <img src="${thumbnail}" onerror="this.src='https://via.placeholder.com/300x169'">
                </div>
                <div class="video-text" onclick="abrirVideo(${video.id})">
                    <h3>${escapeHtml(video.title)}</h3>
                    <p class="video-meta">${video.views} • 💬 ${commentsCount}</p>
                </div>
            `;
            grid.appendChild(card);
        }
        atualizarContador();
    }
    
    window.abrirVideo = function(videoId) {
        const video = videosData.find(v => v.id === videoId);
        if (!video) return;
        document.getElementById('playerWrapper').innerHTML = `<iframe src="${video.embedUrl}" frameborder="0" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%;"></iframe>`;
        document.getElementById('modalTitle').innerText = video.title;
        document.getElementById('modalStats').innerText = video.views;
        atualizarUIlikes(video.id);
        exibirComentarios(videoId);
        document.getElementById('videoModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        
        // Recomendados
        const recList = document.getElementById('recommendedList');
        recList.innerHTML = '';
        for (let rec of videosData.filter(v => v.id !== video.id).slice(0, 5)) {
            const div = document.createElement('div');
            div.style.cssText = 'display:flex; gap:10px; margin-bottom:12px; cursor:pointer; padding:6px; border-radius:8px;';
            div.onmouseover = () => div.style.backgroundColor = '#272727';
            div.onmouseout = () => div.style.backgroundColor = 'transparent';
            div.innerHTML = `<div style="width:100px;"><img src="${rec.thumbnail}" style="width:100%; border-radius:6px;"></div><div><div style="font-weight:500; font-size:13px;">${escapeHtml(rec.title)}</div><div style="font-size:11px; color:#aaa;">${rec.views}</div></div>`;
            div.onclick = () => window.abrirVideo(rec.id);
            recList.appendChild(div);
        }
        
        // Configurar botão de comentário
        const submitBtn = document.getElementById('submitCommentBtn');
        const commentInput = document.getElementById('commentInput');
        submitBtn.onclick = () => { if (adicionarComentario(video.id, commentInput.value)) commentInput.value = ''; };
        commentInput.onkeypress = (e) => { if (e.key === 'Enter' && adicionarComentario(video.id, commentInput.value)) commentInput.value = ''; };
        
        // Configurar likes
        document.getElementById('likeBtn').onclick = () => { likesData[video.id] = (likesData[video.id] || 0) + 1; salvarLikes(); atualizarUIlikes(video.id); };
        document.getElementById('dislikeBtn').onclick = () => { dislikesData[video.id] = (dislikesData[video.id] || 0) + 1; salvarLikes(); atualizarUIlikes(video.id); };
    };
    
    function fecharModal() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('playerWrapper').innerHTML = '';
        document.body.style.overflow = '';
    }
    
    function entrarNaGaleria() {
        if (!currentCreator) { showMessage("❌ Faça login como criador!", true); return; }
        modoGaleria = true;
        renderizarVideos();
        showMessage(`🎬 Modo Galeria: seus vídeos`);
    }
    
    function sairDaGaleria() {
        modoGaleria = false;
        renderizarVideos();
    }
    
    function atualizarUI() {
        const authBtn = document.getElementById('authButton');
        const uploadContainer = document.getElementById('uploadButtonContainer');
        const galeriaSidebar = document.getElementById('galeriaSidebar');
        const adminSidebar = document.getElementById('adminSidebar');
        
        if (isAdmin()) {
            uploadContainer.innerHTML = `<button class="upload-btn" id="uploadBtn">📤 Postar</button>`;
            if (adminSidebar) adminSidebar.style.display = 'flex';
            if (galeriaSidebar) galeriaSidebar.style.display = 'none';
            authBtn.innerHTML = `<div class="user-container"><div class="user-avatar">👑</div><div class="user-name">Admin</div></div>`;
            document.getElementById('uploadBtn')?.addEventListener('click', () => abrirUploadModal());
        } else if (currentCreator) {
            uploadContainer.innerHTML = `<button class="upload-btn" id="uploadBtn">📤 Postar</button>`;
            if (galeriaSidebar) galeriaSidebar.style.display = 'flex';
            if (adminSidebar) adminSidebar.style.display = 'none';
            authBtn.innerHTML = `<div class="user-container"><div class="user-avatar">🎬</div><div class="user-name">${escapeHtml(currentCreator.nome)}<span class="creator-badge">CRIADOR</span></div></div>`;
            document.getElementById('uploadBtn')?.addEventListener('click', () => abrirUploadModal());
            document.getElementById('galeriaSidebar')?.addEventListener('click', () => entrarNaGaleria());
        } else if (currentUser) {
            uploadContainer.innerHTML = '';
            if (galeriaSidebar) galeriaSidebar.style.display = 'none';
            if (adminSidebar) adminSidebar.style.display = 'none';
            authBtn.innerHTML = `<div class="user-container"><div class="user-avatar">👤</div><div class="user-name">${escapeHtml(currentUser.nome)}<span class="user-badge">USUÁRIO</span></div></div>`;
        } else {
            uploadContainer.innerHTML = '';
            if (galeriaSidebar) galeriaSidebar.style.display = 'none';
            if (adminSidebar) adminSidebar.style.display = 'none';
            authBtn.innerHTML = `<button class="login-btn" id="loginBtn">🔑 Entrar</button>`;
            document.getElementById('loginBtn')?.addEventListener('click', () => abrirLoginModal());
        }
        renderizarVideos();
    }
    
    // Eventos de upload
    function setupUploadEvents() {
        document.getElementById('videoFileUpload')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('video/')) {
                selectedVideoFile = file;
                const videoPreview = document.getElementById('videoPreview');
                const previewArea = document.getElementById('videoPreviewArea');
                videoPreview.src = URL.createObjectURL(file);
                previewArea.style.display = 'block';
                showMessage('✅ Vídeo selecionado!');
            }
        });
        
        document.getElementById('googleDriveAuthBtn')?.addEventListener('click', connectGoogleDrive);
        document.getElementById('cancelUploadBtn')?.addEventListener('click', () => document.getElementById('uploadModal').style.display = 'none');
        document.getElementById('submitUploadBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            publicarVideo();
        });
    }
    
    // Inicializar
    function inicializar() {
        carregarVideos();
        carregarComentarios();
        carregarLikes();
        carregarUsuarioAtual();
        renderizarVideos();
        setupUploadEvents();
        
        // Carregar APIs do Google
        const scriptGapi = document.createElement('script');
        scriptGapi.src = 'https://apis.google.com/js/api.js';
        scriptGapi.onload = () => initGoogleAPI();
        document.head.appendChild(scriptGapi);
        
        const scriptGis = document.createElement('script');
        scriptGis.src = 'https://accounts.google.com/gsi/client';
        scriptGis.onload = () => initGIS();
        document.head.appendChild(scriptGis);
        
        document.getElementById('closeLogin')?.addEventListener('click', fecharLoginModal);
        document.querySelector('.close-modal')?.addEventListener('click', fecharModal);
        document.getElementById('homeButton')?.addEventListener('click', () => { fecharModal(); sairDaGaleria(); renderizarVideos(); });
        document.getElementById('homeSidebar')?.addEventListener('click', () => { fecharModal(); sairDaGaleria(); renderizarVideos(); });
        document.getElementById('videoModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('videoModal')) fecharModal(); });
        document.getElementById('uploadModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('uploadModal')) document.getElementById('uploadModal').style.display = 'none'; });
    }
    
    // Verificação de idade
    function verificarIdade() {
        if (localStorage.getItem('wolfTube_ageConfirmed') === 'true') {
            document.getElementById('ageVerification').style.display = 'none';
            document.getElementById('mainContentWrap').style.display = 'block';
            inicializar();
        }
    }
    
    function confirmarMaiorIdade() {
        localStorage.setItem('wolfTube_ageConfirmed', 'true');
        document.getElementById('ageVerification').style.display = 'none';
        document.getElementById('mainContentWrap').style.display = 'block';
        inicializar();
    }
    
    function negarMaiorIdade() {
        document.getElementById('ageVerification').innerHTML = '<div class="age-container"><div class="age-icon">🚫</div><h1>Acesso Negado</h1><p class="age-text">Você não tem idade suficiente.</p><button class="age-btn yes" id="tryAgainBtn">Voltar</button></div>';
        document.getElementById('tryAgainBtn')?.addEventListener('click', () => location.reload());
    }
    
    document.getElementById('ageYesBtn')?.addEventListener('click', confirmarMaiorIdade);
    document.getElementById('ageNoBtn')?.addEventListener('click', negarMaiorIdade);
    verificarIdade();
</script>
