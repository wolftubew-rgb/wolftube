<!DOCTYPE html>
<html>
<head>
    <title>WolfTube</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: white;
        }
        .tela-idade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .idade-box {
            background: #1e1e2e;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff6b6b;
        }
        .idade-box button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .sim { background: #2ecc71; color: white; }
        .nao { background: #e74c3c; color: white; }
        .site { display: none; padding: 20px; }
        header { background: #0f0f0f; padding: 15px; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; color: #ff6b6b; }
        button { background: #3ea6ff; border: none; padding: 8px 20px; border-radius: 20px; color: white; cursor: pointer; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .video-card { background: #1a1a1a; border-radius: 10px; padding: 10px; cursor: pointer; }
        .video-card img { width: 100%; height: 140px; background: #333; border-radius: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 9998; }
        .modal-box { background: #1e1e1e; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
        .modal-box input, .modal-box textarea { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: none; border-radius: 8px; color: white; }
        .fechar { float: right; font-size: 24px; cursor: pointer; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2ecc71;
            border-radius: 5px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="tela-idade" id="telaIdade">
    <div class="idade-box">
        <h1>🔞 WolfTube</h1>
        <p>⚠️ CONTEÚDO PARA MAIORES DE 18 ANOS</p>
        <p>Você confirma que tem 18 anos ou mais?</p>
        <button class="sim" id="btnSim">✅ SIM</button>
        <button class="nao" id="btnNao">❌ NÃO</button>
    </div>
</div>

<div class="site" id="site">
    <header>
        <span class="logo">🐺 WolfTube</span>
        <button id="postarBtn" style="display:none; float:right;">📤 Postar</button>
        <button id="loginBtn" style="float:right; margin-right:10px;">🔑 Entrar</button>
        <span id="userSpan" style="float:right; margin-right:15px; display:none;"></span>
        <div style="clear:both"></div>
    </header>
    <div style="padding: 20px;">
        <div class="video-grid" id="videoGrid"></div>
    </div>
</div>

<div class="modal" id="modalPostar">
    <div class="modal-box">
        <span class="fechar" id="fecharPostar">&times;</span>
        <h3>📤 Publicar Vídeo</h3>
        
        <div style="margin-bottom: 15px;">
            <button id="tabLink" style="background:#3ea6ff;">🔗 Por Link</button>
            <button id="tabUpload" style="background:#444;">📁 Upload</button>
        </div>
        
        <div id="panelLink">
            <input type="text" id="linkUrl" placeholder="Link do YouTube ou Google Drive">
            <input type="text" id="tituloLink" placeholder="Título">
            <textarea id="descLink" placeholder="Descrição" rows="2"></textarea>
            <button id="publicarLinkBtn">Publicar</button>
        </div>
        
        <div id="panelUpload" style="display:none;">
            <button id="googleDriveBtn" style="background:#0f9b0f;">🔐 Conectar Google Drive</button>
            <div id="googleStatus" style="font-size:12px; margin:10px 0;">⚠️ Conecte sua conta Google</div>
            <input type="file" id="videoFile" accept="video/*" disabled>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <input type="text" id="tituloUpload" placeholder="Título">
            <textarea id="descUpload" placeholder="Descrição" rows="2"></textarea>
            <button id="publicarUploadBtn" disabled>Publicar</button>
        </div>
    </div>
</div>

<div class="modal" id="modalLogin">
    <div class="modal-box">
        <span class="fechar" id="fecharLogin">&times;</span>
        <h3>🔑 Entrar</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button id="tabUser" style="flex:1;">👤 Usuário</button>
            <button id="tabCreator" style="flex:1; background:#444;">🎬 Criador</button>
        </div>
        <div id="loginForm"></div>
    </div>
</div>

<script>
// ========== GOOGLE DRIVE CONFIG ==========
const CLIENT_ID = '367616920639-pi7tcbr6sdqvrikechge2hd56unrmp9f.apps.googleusercontent.com';
const API_KEY = 'AIzaSyCTzXUHDyBMHklPb7biw8m8mRbrfj1YxFM';

let tokenClient = null;
let accessToken = null;
let isGoogleConnected = false;
let selectedFile = null;

// ========== VERIFICAÇÃO DE IDADE ==========
var telaIdade = document.getElementById('telaIdade');
var site = document.getElementById('site');
var btnSim = document.getElementById('btnSim');
var btnNao = document.getElementById('btnNao');

btnSim.onclick = function() {
    telaIdade.style.display = 'none';
    site.style.display = 'block';
    localStorage.setItem('idade', 'sim');
    iniciar();
};

btnNao.onclick = function() {
    alert('Você precisa ter 18 anos ou mais.');
};

if (localStorage.getItem('idade') === 'sim') {
    telaIdade.style.display = 'none';
    site.style.display = 'block';
    iniciar();
}

// ========== DADOS ==========
var videos = [];
var usuarioAtual = null;
var criadorAtual = null;
var nextId = 1;

function mostrarMsg(msg, erro) {
    var div = document.createElement('div');
    div.textContent = msg;
    div.style.position = 'fixed';
    div.style.bottom = '20px';
    div.style.left = '50%';
    div.style.transform = 'translateX(-50%)';
    div.style.background = erro ? '#e74c3c' : '#2ecc71';
    div.style.color = 'white';
    div.style.padding = '10px 20px';
    div.style.borderRadius = '25px';
    div.style.zIndex = '9999';
    document.body.appendChild(div);
    setTimeout(function() { div.remove(); }, 3000);
}

function carregarVideos() {
    var salvos = localStorage.getItem('wolftube_videos');
    if (salvos) {
        videos = JSON.parse(salvos);
        var maxId = 0;
        for (var i = 0; i < videos.length; i++) {
            if (videos[i].id > maxId) maxId = videos[i].id;
        }
        nextId = maxId + 1;
    } else {
        videos = [];
        nextId = 1;
    }
    atualizarGrid();
}

function salvarVideos() {
    localStorage.setItem('wolftube_videos', JSON.stringify(videos));
}

function atualizarGrid() {
    var grid = document.getElementById('videoGrid');
    if (!grid) return;
    
    if (videos.length === 0) {
        grid.innerHTML = '<div style="text-align:center;padding:50px;">🎬 Nenhum vídeo disponível</div>';
        return;
    }
    
    grid.innerHTML = '';
    for (var i = 0; i < videos.length; i++) {
        var v = videos[i];
        var card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = '<img src="https://via.placeholder.com/300x140?text=WolfTube"><h4>' + v.titulo + '</h4><p style="font-size:12px; color:#aaa;">👤 ' + v.autor + '</p>';
        card.onclick = (function(link) { return function() { window.open(link, '_blank'); }; })(v.link);
        grid.appendChild(card);
    }
}

// ========== GOOGLE DRIVE FUNCTIONS ==========
function initGoogleAPI() {
    if (typeof gapi !== 'undefined') {
        gapi.load('client', function() {
            gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
        });
    }
}

function initGIS() {
    if (typeof google !== 'undefined' && google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: function(tokenResponse) {
                if (tokenResponse.access_token) {
                    accessToken = tokenResponse.access_token;
                    isGoogleConnected = true;
                    document.getElementById('googleStatus').innerHTML = '✅ Conectado!';
                    document.getElementById('googleStatus').style.color = '#2ecc71';
                    document.getElementById('videoFile').disabled = false;
                    mostrarMsg('✅ Google Drive conectado!');
                }
            }
        });
    }
}

function connectGoogleDrive() {
    if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
    } else {
        initGIS();
        setTimeout(function() { if (tokenClient) tokenClient.requestAccessToken({ prompt: 'consent' }); }, 500);
    }
}

function uploadToDrive(file, title, onProgress) {
    return new Promise(function(resolve, reject) {
        if (!accessToken) { reject('Google Drive não conectado'); return; }
        
        var metadata = { name: title + '.mp4', mimeType: file.type || 'video/mp4' };
        var form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
        form.append('file', file);
        
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');
        xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
        
        xhr.upload.onprogress = function(event) {
            if (event.lengthComputable && onProgress) {
                onProgress((event.loaded / event.total) * 100);
            }
        };
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                var data = JSON.parse(xhr.responseText);
                resolve('https://drive.google.com/file/d/' + data.id + '/preview');
            } else {
                reject('Erro no upload: ' + xhr.status);
            }
        };
        
        xhr.onerror = function() { reject('Erro de conexão'); };
        xhr.send(form);
    });
}

async function publicarUpload() {
    if (!criadorAtual && !(usuarioAtual && usuarioAtual.isAdmin)) {
        mostrarMsg('❌ Apenas criadores e admin!', true);
        return;
    }
    
    if (!selectedFile) {
        mostrarMsg('❌ Selecione um vídeo!', true);
        return;
    }
    
    if (!isGoogleConnected) {
        mostrarMsg('❌ Conecte ao Google Drive primeiro!', true);
        return;
    }
    
    var titulo = document.getElementById('tituloUpload').value.trim();
    if (!titulo) {
        mostrarMsg('❌ Digite um título!', true);
        return;
    }
    
    var descricao = document.getElementById('descUpload').value.trim();
    
    mostrarMsg('⏳ Enviando para o Google Drive...');
    document.getElementById('progressBar').style.display = 'block';
    var progressFill = document.getElementById('progressFill');
    
    try {
        var videoLink = await uploadToDrive(selectedFile, titulo, function(p) {
            progressFill.style.width = p + '%';
        });
        
        var nomeAutor = criadorAtual ? criadorAtual.nome : (usuarioAtual ? usuarioAtual.nome : 'Anônimo');
        
        var novo = {
            id: nextId,
            titulo: titulo,
            link: videoLink,
            autor: nomeAutor,
            descricao: descricao,
            data: new Date().toISOString()
        };
        nextId = nextId + 1;
        
        videos.unshift(novo);
        salvarVideos();
        atualizarGrid();
        
        document.getElementById('modalPostar').style.display = 'none';
        document.getElementById('progressBar').style.display = 'none';
        progressFill.style.width = '0%';
        document.getElementById('tituloUpload').value = '';
        document.getElementById('descUpload').value = '';
        document.getElementById('videoFile').value = '';
        selectedFile = null;
        
        mostrarMsg('✅ Vídeo publicado no Google Drive!');
    } catch(error) {
        document.getElementById('progressBar').style.display = 'none';
        mostrarMsg('❌ Erro no upload: ' + error, true);
    }
}

function publicarLink() {
    var link = document.getElementById('linkUrl').value.trim();
    var titulo = document.getElementById('tituloLink').value.trim();
    var descricao = document.getElementById('descLink').value.trim();
    
    if (!link || !titulo) {
        mostrarMsg('❌ Preencha link e título!', true);
        return;
    }
    
    var embed = link;
    if (link.indexOf('youtube.com/watch?v=') !== -1) {
        var id = link.split('v=')[1];
        if (id) {
            id = id.split('&')[0];
            embed = 'https://www.youtube.com/embed/' + id;
        }
    } else if (link.indexOf('youtu.be/') !== -1) {
        var id = link.split('youtu.be/')[1];
        if (id) {
            id = id.split('?')[0];
            embed = 'https://www.youtube.com/embed/' + id;
        }
    }
    
    var nomeAutor = criadorAtual ? criadorAtual.nome : (usuarioAtual ? usuarioAtual.nome : 'Anônimo');
    
    var novo = {
        id: nextId,
        titulo: titulo,
        link: embed,
        autor: nomeAutor,
        descricao: descricao,
        data: new Date().toISOString()
    };
    nextId = nextId + 1;
    
    videos.unshift(novo);
    salvarVideos();
    atualizarGrid();
    
    document.getElementById('modalPostar').style.display = 'none';
    document.getElementById('linkUrl').value = '';
    document.getElementById('tituloLink').value = '';
    document.getElementById('descLink').value = '';
    mostrarMsg('✅ Vídeo publicado!');
}

// ========== LOGIN ==========
function carregarUsers() { 
    var s = localStorage.getItem('wolftube_users');
    if (s) return JSON.parse(s);
    return {};
}
function salvarUsers(u) { localStorage.setItem('wolftube_users', JSON.stringify(u)); }
function carregarCreators() { 
    var s = localStorage.getItem('wolftube_creators');
    if (s) return JSON.parse(s);
    return {};
}
function salvarCreators(c) { localStorage.setItem('wolftube_creators', JSON.stringify(c)); }

function registrarUser(email, nome, senha) {
    if (!email || !nome || !senha) { mostrarMsg('❌ Preencha tudo!', true); return false; }
    var users = carregarUsers();
    if (users[email]) { mostrarMsg('❌ Email já existe!', true); return false; }
    users[email] = { email: email, nome: nome, senha: senha };
    salvarUsers(users);
    mostrarMsg('✅ Conta criada! Faça login.');
    return true;
}

function registrarCreator(nome, senha) {
    if (!nome || !senha) { mostrarMsg('❌ Preencha tudo!', true); return false; }
    var creators = carregarCreators();
    if (creators[nome]) { mostrarMsg('❌ Nome já existe!', true); return false; }
    creators[nome] = { nome: nome, senha: senha };
    salvarCreators(creators);
    mostrarMsg('✅ Conta de criador criada! Faça login.');
    return true;
}

function loginUser(email, senha) {
    if (email === 'admin@wolftube.com' && senha === 'wolfadmin2010') {
        usuarioAtual = { nome: 'Administrador', isAdmin: true };
        criadorAtual = null;
        atualizarUI();
        mostrarMsg('👑 Admin logado!');
        return true;
    }
    var users = carregarUsers();
    if (users[email] && users[email].senha === senha) {
        usuarioAtual = { nome: users[email].nome, isAdmin: false };
        criadorAtual = null;
        atualizarUI();
        mostrarMsg('👤 Bem-vindo, ' + users[email].nome + '!');
        return true;
    }
    mostrarMsg('❌ Email ou senha incorretos!', true);
    return false;
}

function loginCreator(nome, senha) {
    var creators = carregarCreators();
    if (creators[nome] && creators[nome].senha === senha) {
        criadorAtual = { nome: nome };
        usuarioAtual = null;
        atualizarUI();
        mostrarMsg('🎬 Bem-vindo, criador ' + nome + '!');
        return true;
    }
    mostrarMsg('❌ Nome ou senha incorretos!', true);
    return false;
}

function logout() {
    usuarioAtual = null;
    criadorAtual = null;
    atualizarUI();
    mostrarMsg('🔓 Logout');
}

function atualizarUI() {
    var postarBtn = document.getElementById('postarBtn');
    var loginBtn = document.getElementById('loginBtn');
    var userSpan = document.getElementById('userSpan');
    
    if (usuarioAtual || criadorAtual) {
        var nome = '';
        if (usuarioAtual) nome = usuarioAtual.nome;
        else if (criadorAtual) nome = criadorAtual.nome;
        
        loginBtn.style.display = 'none';
        userSpan.style.display = 'inline';
        var adminTexto = (usuarioAtual && usuarioAtual.isAdmin) ? ' 👑' : '';
        userSpan.innerHTML = '👤 ' + nome + adminTexto + ' <button onclick="window.logout()" style="background:#444; margin-left:10px;">Sair</button>';
        
        if (criadorAtual || (usuarioAtual && usuarioAtual.isAdmin)) {
            postarBtn.style.display = 'inline-block';
        } else {
            postarBtn.style.display = 'none';
        }
    } else {
        loginBtn.style.display = 'inline-block';
        userSpan.style.display = 'none';
        postarBtn.style.display = 'none';
    }
}

// ========== INICIAR ==========
function iniciar() {
    carregarVideos();
    atualizarUI();
    
    // Carregar APIs do Google
    var scriptGapi = document.createElement('script');
    scriptGapi.src = 'https://apis.google.com/js/api.js';
    scriptGapi.onload = function() { initGoogleAPI(); };
    document.head.appendChild(scriptGapi);
    
    var scriptGis = document.createElement('script');
    scriptGis.src = 'https://accounts.google.com/gsi/client';
    scriptGis.onload = function() { initGIS(); };
    document.head.appendChild(scriptGis);
    
    // Eventos
    document.getElementById('postarBtn').onclick = function() {
        if (!criadorAtual && !(usuarioAtual && usuarioAtual.isAdmin)) {
            mostrarMsg('❌ Apenas criadores e admin!', true);
            return;
        }
        document.getElementById('modalPostar').style.display = 'flex';
    };
    
    document.getElementById('loginBtn').onclick = function() {
        document.getElementById('modalLogin').style.display = 'flex';
    };
    
    document.getElementById('fecharPostar').onclick = function() {
        document.getElementById('modalPostar').style.display = 'none';
    };
    
    document.getElementById('fecharLogin').onclick = function() {
        document.getElementById('modalLogin').style.display = 'none';
    };
    
    document.getElementById('publicarLinkBtn').onclick = publicarLink;
    document.getElementById('publicarUploadBtn').onclick = publicarUpload;
    document.getElementById('googleDriveBtn').onclick = connectGoogleDrive;
    
    // Tabs
    var tabLink = document.getElementById('tabLink');
    var tabUpload = document.getElementById('tabUpload');
    var panelLink = document.getElementById('panelLink');
    var panelUpload = document.getElementById('panelUpload');
    
    tabLink.onclick = function() {
        tabLink.style.background = '#3ea6ff';
        tabUpload.style.background = '#444';
        panelLink.style.display = 'block';
        panelUpload.style.display = 'none';
    };
    
    tabUpload.onclick = function() {
        tabUpload.style.background = '#3ea6ff';
        tabLink.style.background = '#444';
        panelUpload.style.display = 'block';
        panelLink.style.display = 'none';
    };
    
    // File input
    document.getElementById('videoFile').onchange = function(e) {
        var file = e.target.files[0];
        if (file && file.type.indexOf('video/') !== -1) {
            selectedFile = file;
            document.getElementById('publicarUploadBtn').disabled = false;
            mostrarMsg('✅ Vídeo selecionado: ' + file.name);
        }
    };
    
    window.onclick = function(e) {
        if (e.target.classList.contains('modal')) {
            e.target.style.display = 'none';
        }
    };
    
    // Login tabs
    var tipo = 'usuario';
    var tabUser = document.getElementById('tabUser');
    var tabCreator = document.getElementById('tabCreator');
    var loginForm = document.getElementById('loginForm');
    
    function atualizarForm() {
        if (tipo === 'usuario') {
            tabUser.style.background = '#3ea6ff';
            tabCreator.style.background = '#444';
            loginForm.innerHTML = '<input type="email" id="email" placeholder="Email" style="width:100%; padding:10px; margin:10px 0; background:#333; border:none; border-radius:8px; color:white;"><input type="text" id="nome" placeholder="Nome" style="width:100%; padding:10px; margin:10px 0; background:#333; border:none; border-radius:8px; color:white;"><input type="password" id="senha" placeholder="Senha" style="width:100%; padding:10px; margin:10px 0; background:#333; border:none; border-radius:8px; color:white;"><button id="loginSubmit" style="width:100%;">Entrar</button><button id="registerSubmit" style="width:100%; margin-top:10px; background:#444;">Criar Conta</button>';
            
            var loginSubmit = document.getElementById('loginSubmit');
            if (loginSubmit) {
                loginSubmit.onclick = function() {
                    var email = document.getElementById('email').value.trim();
                    var senha = document.getElementById('senha').value;
                    if (loginUser(email, senha)) document.getElementById('modalLogin').style.display = 'none';
                };
            }
            var registerSubmit = document.getElementById('registerSubmit');
            if (registerSubmit) {
                registerSubmit.onclick = function() {
                    var email = document.getElementById('email').value.trim();
                    var nome = document.getElementById('nome').value.trim();
                    var senha = document.getElementById('senha').value;
                    registrarUser(email, nome, senha);
                };
            }
        } else {
            tabCreator.style.background = '#4ecdc4';
            tabUser.style.background = '#444';
            loginForm.innerHTML = '<input type="text" id="creatorNome" placeholder="Nome de criador" style="width:100%; padding:10px; margin:10px 0; background:#333; border:none; border-radius:8px; color:white;"><input type="password" id="creatorSenha" placeholder="Senha" style="width:100%; padding:10px; margin:10px 0; background:#333; border:none; border-radius:8px; color:white;"><button id="creatorLogin" style="width:100%;">Entrar</button><button id="creatorRegister" style="width:100%; margin-top:10px; background:#444;">Criar Conta</button>';
            
            var creatorLogin = document.getElementById('creatorLogin');
            if (creatorLogin) {
                creatorLogin.onclick = function() {
                    var nome = document.getElementById('creatorNome').value.trim();
                    var senha = document.getElementById('creatorSenha').value;
                    if (loginCreator(nome, senha)) document.getElementById('modalLogin').style.display = 'none';
                };
            }
            var creatorRegister = document.getElementById('creatorRegister');
            if (creatorRegister) {
                creatorRegister.onclick = function() {
                    var nome = document.getElementById('creatorNome').value.trim();
                    var senha = document.getElementById('creatorSenha').value;
                    registrarCreator(nome, senha);
                };
            }
        }
    }
    
    tabUser.onclick = function() { tipo = 'usuario'; atualizarForm(); };
    tabCreator.onclick = function() { tipo = 'criador'; atualizarForm(); };
    atualizarForm();
}

window.logout = logout;
</script>
</body>
</html>
