<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfTube - Funcional</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        button {
            background: #ff4757;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        .video-card {
            background: #16213e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .hidden { display: none; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
            width: 600px;
        }
        iframe {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>🐺 WolfTube</h1>
    
    <div>
        <button onclick="showLogin()">Entrar</button>
        <button onclick="showCadastro()">Cadastrar</button>
        <button id="sairBtn" onclick="logout()" style="display:none">Sair</button>
    </div>

    <div id="uploadArea" style="display:none; margin-top:20px; padding:20px; background:#16213e; border-radius:10px;">
        <h3>Publicar Vídeo</h3>
        <input type="text" id="titulo" placeholder="Título">
        <input type="text" id="link" placeholder="Link do Google Drive">
        <textarea id="desc" placeholder="Descrição"></textarea>
        <button onclick="publicar()">Publicar</button>
    </div>

    <h2>Vídeos</h2>
    <div id="videos"></div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <h3>Login</h3>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginSenha" placeholder="Senha">
            <button onclick="fazerLogin()">Entrar</button>
            <button onclick="fecharModal('loginModal')">Fechar</button>
        </div>
    </div>

    <!-- Modal Cadastro -->
    <div id="cadastroModal" class="modal hidden">
        <div class="modal-content">
            <h3>Cadastro</h3>
            <input type="text" id="cadNome" placeholder="Nome">
            <input type="email" id="cadEmail" placeholder="Email">
            <input type="password" id="cadSenha" placeholder="Senha">
            <select id="cadTipo">
                <option value="user">Usuário</option>
                <option value="creator">Criador</option>
            </select>
            <button onclick="fazerCadastro()">Cadastrar</button>
            <button onclick="fecharModal('cadastroModal')">Fechar</button>
        </div>
    </div>

    <!-- Modal Vídeo -->
    <div id="videoModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="videoTitulo"></h3>
            <iframe id="videoFrame" src=""></iframe>
            <p id="videoAutor"></p>
            <p id="videoViews"></p>
            <p id="videoDesc"></p>
            <button onclick="fecharModal('videoModal')">Fechar</button>
        </div>
    </div>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDakcmBAjmOQKQavFMpv1qWf4Xuqvhl0cY",
            authDomain: "wolftube-56e62.firebaseapp.com",
            projectId: "wolftube-56e62",
            storageBucket: "wolftube-56e62.firebasestorage.app",
            messagingSenderId: "251733558803",
            appId: "1:251733558803:web:e0be0827bafa6d8b6421e6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let usuarioAtual = null;

        // Idade
        if (!localStorage.getItem('idade')) {
            if (confirm('Você tem 18 anos ou mais?')) {
                localStorage.setItem('idade', 'sim');
            } else {
                document.body.innerHTML = '<h1>Acesso Negado</h1>';
            }
        }

        // Usuários padrão
        if (!localStorage.getItem('usuarios')) {
            localStorage.setItem('usuarios', JSON.stringify([
                { email: 'admin@wolftube.com', senha: 'wolfadmin2010', nome: 'Admin', tipo: 'admin' }
            ]));
        }

        function showLogin() { document.getElementById('loginModal').classList.remove('hidden'); }
        function showCadastro() { document.getElementById('cadastroModal').classList.remove('hidden'); }
        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

        function fazerLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios'));
            const user = usuarios.find(u => u.email === email && u.senha === senha);
            
            if (user) {
                usuarioAtual = user;
                localStorage.setItem('usuarioAtual', JSON.stringify(user));
                document.getElementById('uploadArea').style.display = 'block';
                document.querySelector('button[onclick="showLogin()"]').style.display = 'none';
                document.querySelector('button[onclick="showCadastro()"]').style.display = 'none';
                document.getElementById('sairBtn').style.display = 'inline-block';
                fecharModal('loginModal');
                alert(`Bem-vindo, ${user.nome}!`);
                carregarVideos();
            } else {
                alert('Erro!');
            }
        }

        function fazerCadastro() {
            const nome = document.getElementById('cadNome').value;
            const email = document.getElementById('cadEmail').value;
            const senha = document.getElementById('cadSenha').value;
            const tipo = document.getElementById('cadTipo').value;
            
            const usuarios = JSON.parse(localStorage.getItem('usuarios'));
            usuarios.push({ nome, email, senha, tipo });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            alert('Cadastro realizado! Faça login.');
            fecharModal('cadastroModal');
        }

        function logout() {
            usuarioAtual = null;
            localStorage.removeItem('usuarioAtual');
            document.getElementById('uploadArea').style.display = 'none';
            document.querySelector('button[onclick="showLogin()"]').style.display = 'inline-block';
            document.querySelector('button[onclick="showCadastro()"]').style.display = 'inline-block';
            document.getElementById('sairBtn').style.display = 'none';
            alert('Saiu!');
            carregarVideos();
        }

        async function publicar() {
            const titulo = document.getElementById('titulo').value;
            let link = document.getElementById('link').value;
            const desc = document.getElementById('desc').value;
            
            if (!titulo || !link) {
                alert('Preencha título e link!');
                return;
            }
            
            // Converter link
            let embedUrl = link;
            if (link.includes('/file/d/')) {
                const id = link.split('/file/d/')[1].split('/')[0];
                embedUrl = `https://drive.google.com/file/d/${id}/preview`;
            }
            
            await db.collection('videos').add({
                titulo: titulo,
                url: embedUrl,
                desc: desc || '',
                autor: usuarioAtual.nome,
                autorEmail: usuarioAtual.email,
                data: new Date().toISOString(),
                views: 0
            });
            
            alert('Publicado!');
            document.getElementById('titulo').value = '';
            document.getElementById('link').value = '';
            document.getElementById('desc').value = '';
            carregarVideos();
        }

        async function carregarVideos() {
            const snapshot = await db.collection('videos').orderBy('data', 'desc').get();
            const videos = [];
            snapshot.forEach(doc => videos.push({ id: doc.id, ...doc.data() }));
            
            const div = document.getElementById('videos');
            if (videos.length === 0) {
                div.innerHTML = '<p>Nenhum vídeo</p>';
                return;
            }
            
            div.innerHTML = videos.map(v => `
                <div class="video-card" onclick="abrirVideo('${v.id}')">
                    <h3>${v.titulo}</h3>
                    <p>👤 ${v.autor} | 👁️ ${v.views || 0} views</p>
                    ${usuarioAtual && (usuarioAtual.email === v.autorEmail || usuarioAtual.tipo === 'admin') ? 
                        `<button onclick="event.stopPropagation(); deletar('${v.id}')" style="background:#ff4757; margin-top:10px;">Excluir</button>` : ''}
                </div>
            `).join('');
        }

        async function abrirVideo(id) {
            const doc = await db.collection('videos').doc(id).get();
            const v = doc.data();
            
            await db.collection('videos').doc(id).update({ views: (v.views || 0) + 1 });
            
            document.getElementById('videoTitulo').innerHTML = v.titulo;
            document.getElementById('videoFrame').src = v.url;
            document.getElementById('videoAutor').innerHTML = `👤 ${v.autor}`;
            document.getElementById('videoViews').innerHTML = `👁️ ${(v.views || 0) + 1} views`;
            document.getElementById('videoDesc').innerHTML = v.desc;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        async function deletar(id) {
            if (confirm('Excluir?')) {
                await db.collection('videos').doc(id).delete();
                carregarVideos();
            }
        }

        // Iniciar
        const userSalvo = localStorage.getItem('usuarioAtual');
        if (userSalvo) {
            usuarioAtual = JSON.parse(userSalvo);
            document.getElementById('uploadArea').style.display = 'block';
            document.querySelector('button[onclick="showLogin()"]').style.display = 'none';
            document.querySelector('button[onclick="showCadastro()"]').style.display = 'none';
            document.getElementById('sairBtn').style.display = 'inline-block';
        }
        carregarVideos();
    </script>
</body>
</html>
