<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WolfTube - Vídeos</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
        }
        .header {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #ff4757;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i { color: #ff4757; }
        .logo span:first-child { color: #ff4757; }
        .nav-buttons { display: flex; gap: 12px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); }
        .btn-primary { background: #ff4757; color: white; }
        .btn-secondary { background: #00b894; color: white; }
        .btn-danger { background: #2c3e50; color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .upload-area {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ff4757; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        .video-upload {
            border: 2px dashed #ff4757;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        .video-upload i { font-size: 48px; color: #ff4757; }
        .video-preview { margin-top: 15px; position: relative; display: inline-block; }
        .video-preview video { max-width: 100%; max-height: 200px; border-radius: 10px; }
        .remove-video {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff4757;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            color: white;
        }
        .thumbnail-upload {
            border: 2px dashed #ff4757;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        .thumbnail-upload i { font-size: 48px; color: #ff4757; }
        .thumbnail-preview { margin-top: 15px; position: relative; display: inline-block; }
        .thumbnail-preview img { max-width: 200px; max-height: 120px; border-radius: 10px; }
        .remove-thumbnail {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff4757;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            color: white;
        }
        .progress-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; margin-top: 10px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #ff4757; border-radius: 5px; }
        .videos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .video-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .video-card:hover { transform: translateY(-5px); }
        .video-thumbnail {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-thumbnail::after {
            content: '▶';
            position: absolute;
            font-size: 48px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-card:hover .video-thumbnail::after { opacity: 0.9; }
        .video-info { padding: 20px; }
        .video-title { font-weight: bold; margin-bottom: 10px; color: #ff4757; }
        .video-meta { font-size: 13px; color: #ccc; margin-top: 10px; }
        .video-meta i { width: 20px; }
        .delete-btn { margin-top: 10px; width: 100%; padding: 8px; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content, .login-box {
            background: #1e1e2e;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
        }
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .video-container {
            background: #1e1e2e;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            padding: 20px;
        }
        .video-container video { width: 100%; max-height: 400px; }
        .hidden { display: none; }
        .alert {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .success { background: #00b894; }
        .error { background: #ff4757; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .videos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><i class="fas fa-wolf-pack-battalion"></i><span>Wolf</span><span>Tube</span></div>
        <div class="nav-buttons">
            <button class="btn-primary" onclick="showLoginModal()">Entrar</button>
            <button class="btn-secondary" onclick="showRegisterModal()">Cadastrar</button>
            <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none;">Sair</button>
        </div>
    </div>

    <div class="container">
        <div class="upload-area" id="uploadArea" style="display:none;">
            <h2>Publicar Vídeo</h2>
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="videoTitle" placeholder="Título do vídeo">
            </div>
            <div class="form-group">
                <label>Vídeo</label>
                <div class="video-upload" onclick="document.getElementById('videoInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>📱 Clique para escolher um vídeo</p>
                </div>
                <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="previewVideo(this)">
                <div id="videoPreviewContainer" style="display: none;" class="video-preview">
                    <video id="videoPreview" controls></video>
                    <button class="remove-video" onclick="removeVideo()">✕</button>
                </div>
                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="form-group">
                <label>Capa (opcional)</label>
                <div class="thumbnail-upload" onclick="document.getElementById('thumbnailInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>📸 Clique para escolher uma foto</p>
                </div>
                <input type="file" id="thumbnailInput" accept="image/*" style="display: none;" onchange="previewThumbnail(this)">
                <div id="thumbnailPreviewContainer" style="display: none;" class="thumbnail-preview">
                    <img id="thumbnailPreview" src="">
                    <button class="remove-thumbnail" onclick="removeThumbnail()">✕</button>
                </div>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="videoDesc" rows="3" placeholder="Descrição do vídeo..."></textarea>
            </div>
            <button class="btn-primary" id="publishBtn" onclick="postVideo()">Publicar</button>
        </div>

        <div class="videos-header">
            <h2>Vídeos</h2>
        </div>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Modais -->
    <div class="modal" id="ageModal">
        <div class="modal-content">
            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff4757;"></i>
            <h2>Verificação</h2>
            <p>Você tem 18 anos ou mais?</p>
            <button class="btn-primary" onclick="verifyAge(true)">SIM</button>
            <button class="btn-danger" onclick="verifyAge(false)">NÃO</button>
        </div>
    </div>

    <div class="modal hidden" id="loginModal">
        <div class="login-box">
            <i class="fas fa-user-circle" style="font-size: 48px; color: #ff4757;"></i>
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Senha">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
            <button class="btn-secondary" onclick="closeLoginModal()">Fechar</button>
        </div>
    </div>

    <div class="modal hidden" id="registerModal">
        <div class="login-box">
            <i class="fas fa-user-plus" style="font-size: 48px; color: #00b894;"></i>
            <h2>Cadastro</h2>
            <input type="text" id="regName" placeholder="Nome">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Senha">
            <select id="regType">
                <option value="user">Usuário</option>
                <option value="creator">Criador</option>
            </select>
            <button class="btn-primary" onclick="doRegister()">Cadastrar</button>
            <button class="btn-secondary" onclick="closeRegisterModal()">Fechar</button>
        </div>
    </div>

    <div id="videoPlayerModal" class="video-modal hidden">
        <div class="video-container">
            <h3 id="modalVideoTitle">Título</h3>
            <video id="videoPlayer" src="" controls></video>
            <p><i class="fas fa-user"></i> <span id="modalAuthor"></span></p>
            <p><i class="fas fa-eye"></i> <span id="modalViews"></span> views</p>
            <p><i class="fas fa-align-left"></i> <span id="modalDescription"></span></p>
            <button class="btn-secondary" onclick="closeVideoModal()">Fechar</button>
        </div>
    </div>

    <script>
        let currentVideoFile = null;
        let currentThumbnailFile = null;
        let currentUser = null;

        const firebaseConfig = {
            apiKey: "AIzaSyDakcmBAjmOQKQavFMpv1qWf4Xuqvhl0cY",
            authDomain: "wolftube-56e62.firebaseapp.com",
            projectId: "wolftube-56e62",
            storageBucket: "wolftube-56e62.firebasestorage.app",
            messagingSenderId: "251733558803",
            appId: "1:251733558803:web:e0be0827bafa6d8b6421e6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Login
        function loadUsers() {
            if (!localStorage.getItem('wolftube_users')) {
                localStorage.setItem('wolftube_users', JSON.stringify([
                    { email: 'admin@wolftube.com', password: 'wolfadmin2010', name: 'Admin', type: 'admin' }
                ]));
            }
        }
        loadUsers();

        function verifyAge(hasAge) {
            if (hasAge) {
                localStorage.setItem('ageVerified', 'true');
                document.getElementById('ageModal').style.display = 'none';
            } else {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h1>Acesso negado</h1></div>';
            }
        }

        if (!localStorage.getItem('ageVerified')) {
            document.getElementById('ageModal').style.display = 'flex';
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('wolftube_currentUser', JSON.stringify(user));
                document.getElementById('uploadArea').style.display = 'block';
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'none';
                });
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                closeLoginModal();
                alert(`Bem-vindo, ${user.name}!`);
                carregarVideos();
            } else {
                alert('Email ou senha incorretos!');
            }
        }

        function doRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const type = document.getElementById('regType').value;
            
            if (!name || !email || !password) {
                alert('Preencha todos os campos!');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            if (users.find(u => u.email === email)) {
                alert('Email já cadastrado!');
                return;
            }
            
            users.push({ name, email, password, type });
            localStorage.setItem('wolftube_users', JSON.stringify(users));
            alert('Cadastro realizado! Faça login.');
            closeRegisterModal();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('wolftube_currentUser');
            document.getElementById('uploadArea').style.display = 'none';
            document.querySelectorAll('.nav-buttons button').forEach(btn => {
                if (btn.id !== 'logoutBtn') btn.style.display = 'inline-flex';
            });
            document.getElementById('logoutBtn').style.display = 'none';
            alert('Você saiu da conta.');
            carregarVideos();
        }

        function showLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
        function showRegisterModal() { document.getElementById('registerModal').classList.remove('hidden'); }
        function closeRegisterModal() { document.getElementById('registerModal').classList.add('hidden'); }

        function previewVideo(input) {
            if (input.files && input.files[0]) {
                currentVideoFile = input.files[0];
                const videoURL = URL.createObjectURL(currentVideoFile);
                document.getElementById('videoPreview').src = videoURL;
                document.getElementById('videoPreviewContainer').style.display = 'inline-block';
            }
        }

        function removeVideo() {
            currentVideoFile = null;
            document.getElementById('videoPreviewContainer').style.display = 'none';
            document.getElementById('videoPreview').src = '';
            document.getElementById('videoInput').value = '';
        }

        function previewThumbnail(input) {
            if (input.files && input.files[0]) {
                currentThumbnailFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('thumbnailPreview').src = e.target.result;
                    document.getElementById('thumbnailPreviewContainer').style.display = 'inline-block';
                };
                reader.readAsDataURL(currentThumbnailFile);
            }
        }

        function removeThumbnail() {
            currentThumbnailFile = null;
            document.getElementById('thumbnailPreviewContainer').style.display = 'none';
            document.getElementById('thumbnailPreview').src = '';
            document.getElementById('thumbnailInput').value = '';
        }

        async function postVideo() {
            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDesc').value;
            
            if (!title || !currentVideoFile) {
                alert('Preencha título e escolha um vídeo!');
                return;
            }
            
            if (!currentUser || (currentUser.type !== 'creator' && currentUser.type !== 'admin')) {
                alert('Apenas criadores podem postar vídeos!');
                return;
            }
            
            const publishBtn = document.getElementById('publishBtn');
            publishBtn.disabled = true;
            publishBtn.innerHTML = 'Enviando...';
            
            try {
                const videoId = Date.now();
                const videoRef = storage.ref(`videos/${videoId}`);
                const uploadTask = videoRef.put(currentVideoFile);
                
                document.getElementById('progressBar').style.display = 'block';
                
                const snapshot = await new Promise((resolve, reject) => {
                    uploadTask.on('state_changed',
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            document.getElementById('progressFill').style.width = progress + '%';
                        },
                        reject,
                        () => resolve(uploadTask.snapshot)
                    );
                });
                
                const videoURL = await snapshot.ref.getDownloadURL();
                
                let thumbnailURL = '';
                if (currentThumbnailFile) {
                    const thumbnailRef = storage.ref(`thumbnails/${videoId}`);
                    await thumbnailRef.put(currentThumbnailFile);
                    thumbnailURL = await thumbnailRef.getDownloadURL();
                }
                
                await db.collection('videos').add({
                    title: title,
                    url: videoURL,
                    thumbnail: thumbnailURL,
                    description: description || 'Sem descrição',
                    author: currentUser.name,
                    authorEmail: currentUser.email,
                    date: new Date().toISOString(),
                    views: 0
                });
                
                alert('Vídeo publicado!');
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoDesc').value = '';
                removeVideo();
                removeThumbnail();
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressBar').style.display = 'none';
                carregarVideos();
            } catch (error) {
                alert('Erro: ' + error.message);
                console.error(error);
                document.getElementById('progressBar').style.display = 'none';
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerHTML = 'Publicar';
            }
        }

        async function carregarVideos() {
            try {
                const snapshot = await db.collection('videos').orderBy('date', 'desc').get();
                const videos = [];
                snapshot.forEach(doc => { 
                    videos.push({ id: doc.id, ...doc.data() }); 
                });
                
                const grid = document.getElementById('videosGrid');
                if (videos.length === 0) {
                    grid.innerHTML = '<p>Nenhum vídeo ainda</p>';
                    return;
                }
                
                grid.innerHTML = videos.map(video => `
                    <div class="video-card" onclick="openVideo('${video.id}', ${video.views || 0})">
                        <div class="video-thumbnail" style="background-image: url('${video.thumbnail || 'https://via.placeholder.com/320x200/ff4757/ffffff?text=WolfTube'}');">
                            ${!video.thumbnail ? '<i class="fas fa-play-circle"></i>' : ''}
                        </div>
                        <div class="video-info">
                            <div class="video-title">${escapeHtml(video.title)}</div>
                            <div class="video-meta">
                                <div><i class="fas fa-user"></i> ${escapeHtml(video.author)}</div>
                                <div><i class="fas fa-eye"></i> ${video.views || 0} views</div>
                            </div>
                            ${currentUser && (currentUser.email === video.authorEmail || currentUser.type === 'admin') ? 
                                `<button class="btn-danger delete-btn" onclick="event.stopPropagation(); deletarVideo('${video.id}')">Excluir</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                document.getElementById('videosGrid').innerHTML = '<p>Erro ao carregar vídeos</p>';
            }
        }

        async function openVideo(videoId, currentViews) {
            try {
                const videoRef = db.collection('videos').doc(videoId);
                const video = await videoRef.get();
                
                if (!video.exists) {
                    alert('Vídeo não encontrado!');
                    return;
                }
                
                const data = video.data();
                await videoRef.update({ views: (currentViews || 0) + 1 });
                
                document.getElementById('modalVideoTitle').innerHTML = data.title;
                document.getElementById('modalAuthor').innerHTML = data.author;
                document.getElementById('modalViews').innerHTML = (currentViews || 0) + 1;
                document.getElementById('modalDescription').innerHTML = data.description;
                
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = data.url;
                videoPlayer.load();
                
                document.getElementById('videoPlayerModal').classList.remove('hidden');
            } catch (error) {
                alert('Erro ao abrir vídeo');
            }
        }

        function closeVideoModal() {
            document.getElementById('videoPlayerModal').classList.add('hidden');
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.pause();
            videoPlayer.src = '';
        }

        async function deletarVideo(videoId) {
            if (confirm('Excluir este vídeo?')) {
                try {
                    await db.collection('videos').doc(videoId).delete();
                    alert('Vídeo excluído!');
                    carregarVideos();
                } catch (error) {
                    alert('Erro ao excluir');
                }
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Inicialização
        const savedUser = localStorage.getItem('wolftube_currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('uploadArea').style.display = 'block';
            document.querySelectorAll('.nav-buttons button').forEach(btn => {
                if (btn.id !== 'logoutBtn') btn.style.display = 'none';
            });
            document.getElementById('logoutBtn').style.display = 'inline-flex';
        }
        carregarVideos();
    </script>
</body>
</html>
