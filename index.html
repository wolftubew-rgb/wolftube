<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olha Aí - Modificador de Cores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        .header {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #ff4757;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i { color: #ff4757; font-size: 36px; }
        .logo span { 
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-buttons { display: flex; gap: 12px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #00b894, #00cec9); color: white; }
        .btn-danger { background: #2c3e50; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        
        .painel-cores {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        .painel-cores h2 { margin-bottom: 20px; }
        .grupo-botoes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .botao-cor {
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .botao-cor:hover { transform: scale(1.05); }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .video-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .footer {
            margin-top: 60px;
            padding: 30px;
            background: rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-eye"></i>
            <span>OLHA AÍ</span>
        </div>
        <div class="nav-buttons">
            <button class="btn-primary" onclick="alert('Login')"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <button class="btn-secondary" onclick="alert('Cadastro')"><i class="fas fa-user-plus"></i> Cadastrar</button>
        </div>
    </div>

    <div class="container">
        <!-- PAINEL DE CORES - FUNCIONA IMEDIATAMENTE -->
        <div class="painel-cores">
            <h2><i class="fas fa-palette"></i> 🎨 PAINEL DE CORES - CLIQUE E MUDE!</h2>
            <div class="grupo-botoes">
                <button class="botao-cor" style="background: linear-gradient(135deg, #3498db, #2980b9);" onclick="mudarCorSite('azul')">🔵 AZUL</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #27ae60, #2ecc71);" onclick="mudarCorSite('verde')">🟢 VERDE</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);" onclick="mudarCorSite('roxo')">🟣 ROXO</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #e84393, #fd79a8);" onclick="mudarCorSite('rosa')">🌸 ROSA</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #e74c3c, #c0392b);" onclick="mudarCorSite('vermelho')">🔴 VERMELHO</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #e67e22, #f39c12);" onclick="mudarCorSite('laranja')">🟠 LARANJA</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #1a1a2e, #16213e);" onclick="mudarCorSite('escuro')">🌑 ESCURO</button>
                <button class="botao-cor" style="background: linear-gradient(135deg, #ff4757, #ff6b81);" onclick="mudarCorSite('padrao')">✨ PADRÃO</button>
            </div>
        </div>

        <!-- VÍDEOS -->
        <h2><i class="fas fa-video"></i> Vídeos</h2>
        <div class="videos-grid" id="videosGrid">
            <div class="video-card">
                <i class="fas fa-play-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
                <h3>Bem-vindo ao Olha Aí!</h3>
                <p>Clique nos botões acima para mudar as cores do site</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2024 Olha Aí - Clique nos botões para mudar as cores!</p>
    </div>

    <script>
        // FUNÇÃO QUE MUDA AS CORES DE VERDADE
        function mudarCorSite(cor) {
            let corPrimaria, corSecundaria, corFundo1, corFundo2;
            
            switch(cor) {
                case 'azul':
                    corPrimaria = "#3498db";
                    corSecundaria = "#2980b9";
                    corFundo1 = "#0f0c29";
                    corFundo2 = "#1a1a2e";
                    break;
                case 'verde':
                    corPrimaria = "#27ae60";
                    corSecundaria = "#2ecc71";
                    corFundo1 = "#0a2a1a";
                    corFundo2 = "#1a3a2a";
                    break;
                case 'roxo':
                    corPrimaria = "#9b59b6";
                    corSecundaria = "#8e44ad";
                    corFundo1 = "#1a0a2a";
                    corFundo2 = "#2a1a3a";
                    break;
                case 'rosa':
                    corPrimaria = "#e84393";
                    corSecundaria = "#fd79a8";
                    corFundo1 = "#2a0a1a";
                    corFundo2 = "#3a1a2a";
                    break;
                case 'vermelho':
                    corPrimaria = "#e74c3c";
                    corSecundaria = "#c0392b";
                    corFundo1 = "#2a0a0a";
                    corFundo2 = "#3a1a1a";
                    break;
                case 'laranja':
                    corPrimaria = "#e67e22";
                    corSecundaria = "#f39c12";
                    corFundo1 = "#2a1a0a";
                    corFundo2 = "#3a2a1a";
                    break;
                case 'escuro':
                    corPrimaria = "#2c3e50";
                    corSecundaria = "#34495e";
                    corFundo1 = "#000000";
                    corFundo2 = "#1a1a2e";
                    break;
                default: // padrão
                    corPrimaria = "#ff4757";
                    corSecundaria = "#ff6b81";
                    corFundo1 = "#0f0c29";
                    corFundo2 = "#24243e";
            }
            
            // Mudar fundo do body
            document.body.style.background = `linear-gradient(135deg, ${corFundo1} 0%, #302b63 50%, ${corFundo2} 100%)`;
            
            // Mudar TODOS os botões principais
            const botoes = document.querySelectorAll('.btn-primary, .botao-cor');
            botoes.forEach(btn => {
                if (btn.classList.contains('btn-primary')) {
                    btn.style.background = `linear-gradient(135deg, ${corPrimaria}, ${corSecundaria})`;
                }
            });
            
            // Mudar borda do header
            document.querySelector('.header').style.borderBottomColor = corPrimaria;
            
            // Mudar cor do ícone do logo
            document.querySelector('.logo i').style.color = corPrimaria;
            
            // Mudar gradiente do texto do logo
            document.querySelector('.logo span').style.background = `linear-gradient(135deg, ${corPrimaria}, ${corSecundaria})`;
            document.querySelector('.logo span').style.webkitBackgroundClip = 'text';
            
            // Mostrar mensagem de confirmação
            mostrarMensagem(`✅ Cores alteradas para ${cor.toUpperCase()}!`);
        }
        
        function mostrarMensagem(msg) {
            // Criar elemento de mensagem temporária
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.bottom = '20px';
            div.style.right = '20px';
            div.style.backgroundColor = '#27ae60';
            div.style.color = 'white';
            div.style.padding = '15px 25px';
            div.style.borderRadius = '10px';
            div.style.zIndex = '9999';
            div.style.fontWeight = 'bold';
            div.style.boxShadow = '0 5px 15px rgba(0,0,0,0.3)';
            div.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
        
        // Carregar cores salvas ao iniciar
        function carregarCoresSalvas() {
            const corSalva = localStorage.getItem('corSite');
            if (corSalva && corSalva !== 'padrao') {
                mudarCorSite(corSalva);
            }
        }
        
        // Salvar cor quando mudar
        const mudarCorSiteOriginal = mudarCorSite;
        window.mudarCorSite = function(cor) {
            mudarCorSiteOriginal(cor);
            localStorage.setItem('corSite', cor);
        };
        
        carregarCoresSalvas();
    </script>
</body>
</html>
