<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfTube - Teste</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #ff4757;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { opacity: 0.8; }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .hidden { display: none; }
        .success { background: #00b894; }
        .error { background: #ff4757; }
    </style>
</head>
<body>
    <h1>🐺 WolfTube - Teste</h1>
    
    <!-- Login -->
    <div class="card" id="loginCard">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" value="admin@wolftube.com">
        <input type="password" id="senha" placeholder="Senha" value="wolfadmin2010">
        <button onclick="fazerLogin()">Entrar</button>
        <button onclick="mostrarCadastro()">Criar Conta</button>
    </div>

    <!-- Cadastro -->
    <div class="card hidden" id="cadastroCard">
        <h2>Cadastro</h2>
        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="emailCad" placeholder="Email">
        <input type="password" id="senhaCad" placeholder="Senha">
        <select id="tipo">
            <option value="user">Usuário</option>
            <option value="creator">Criador</option>
        </select>
        <button onclick="fazerCadastro()">Cadastrar</button>
        <button onclick="mostrarLogin()">Voltar</button>
    </div>

    <!-- Publicar Vídeo (só aparece para criadores) -->
    <div class="card hidden" id="publicarCard">
        <h2>📤 Publicar Vídeo</h2>
        <input type="text" id="titulo" placeholder="Título do vídeo">
        <input type="text" id="linkVideo" placeholder="Link do Google Drive">
        <input type="file" id="capa" accept="image/*">
        <textarea id="descricao" rows="3" placeholder="Descrição"></textarea>
        <button onclick="publicarVideo()">📤 PUBLICAR VÍDEO</button>
        <button onclick="logout()" style="background:#2c3e50">Sair</button>
    </div>

    <!-- Lista de Vídeos -->
    <div class="card">
        <h2>📺 Vídeos</h2>
        <div id="listaVideos">Carregando...</div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDakcmBAjmOQKQavFMpv1qWf4Xuqvhl0cY",
            authDomain: "wolftube-56e62.firebaseapp.com",
            projectId: "wolftube-56e62",
            storageBucket: "wolftube-56e62.firebasestorage.app",
            messagingSenderId: "251733558803",
            appId: "1:251733558803:web:e0be0827bafa6d8b6421e6"
        };

        // Inicializar
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let usuarioAtual = null;

        // Mostrar/Esconder telas
        function mostrarLogin() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('cadastroCard').classList.add('hidden');
            document.getElementById('publicarCard').classList.add('hidden');
        }

        function mostrarCadastro() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('cadastroCard').classList.remove('hidden');
            document.getElementById('publicarCard').classList.add('hidden');
        }

        function mostrarPublicar() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('cadastroCard').classList.add('hidden');
            document.getElementById('publicarCard').classList.remove('hidden');
        }

        // Criar admin padrão
        async function criarAdmin() {
            try {
                const adminRef = db.collection('usuarios').doc('admin@wolftube.com');
                const adminDoc = await adminRef.get();
                if (!adminDoc.exists) {
                    await adminRef.set({
                        email: 'admin@wolftube.com',
                        password: 'wolfadmin2010',
                        name: 'Administrador',
                        type: 'admin'
                    });
                    console.log("✅ Admin criado!");
                }
            } catch (error) {
                console.error("Erro ao criar admin:", error);
            }
        }

        // Login
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            if (!email || !senha) {
                alert('Preencha email e senha!');
                return;
            }
            
            try {
                const userDoc = await db.collection('usuarios').doc(email).get();
                
                if (userDoc.exists && userDoc.data().password === senha) {
                    usuarioAtual = userDoc.data();
                    localStorage.setItem('usuario', JSON.stringify(usuarioAtual));
                    
                    alert(`Bem-vindo, ${usuarioAtual.name}!`);
                    
                    if (usuarioAtual.type === 'creator' || usuarioAtual.type === 'admin') {
                        mostrarPublicar();
                    } else {
                        alert('Você é usuário comum. Não pode postar vídeos.');
                        mostrarLogin();
                    }
                    
                    carregarVideos();
                } else {
                    alert('Email ou senha incorretos!');
                }
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        // Cadastro
        async function fazerCadastro() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('emailCad').value;
            const senha = document.getElementById('senhaCad').value;
            const tipo = document.getElementById('tipo').value;
            
            if (!nome || !email || !senha) {
                alert('Preencha todos os campos!');
                return;
            }
            
            try {
                const userDoc = await db.collection('usuarios').doc(email).get();
                
                if (userDoc.exists) {
                    alert('Email já cadastrado!');
                    return;
                }
                
                await db.collection('usuarios').doc(email).set({
                    email: email,
                    password: senha,
                    name: nome,
                    type: tipo
                });
                
                alert('Cadastro realizado! Faça login.');
                mostrarLogin();
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        function logout() {
            usuarioAtual = null;
            localStorage.removeItem('usuario');
            mostrarLogin();
            alert('Você saiu da conta.');
        }

        // Publicar Vídeo
        async function publicarVideo() {
            console.log("🔘 Botão PUBLICAR clicado!");
            
            const titulo = document.getElementById('titulo').value;
            let link = document.getElementById('linkVideo').value;
            const descricao = document.getElementById('descricao').value;
            const capaInput = document.getElementById('capa');
            
            // Validar
            if (!titulo) {
                alert('Digite um título!');
                return;
            }
            
            if (!link) {
                alert('Cole o link do Google Drive!');
                return;
            }
            
            if (!usuarioAtual) {
                alert('Faça login primeiro!');
                return;
            }
            
            // Converter link do Google Drive
            let embedUrl = link;
            if (link.includes('drive.google.com')) {
                let fileId = '';
                if (link.includes('/file/d/')) {
                    fileId = link.split('/file/d/')[1].split('/')[0];
                } else if (link.includes('id=')) {
                    fileId = link.split('id=')[1].split('&')[0];
                }
                if (fileId) {
                    embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                }
            }
            
            // Processar capa (se tiver)
            let capaBase64 = '';
            if (capaInput.files && capaInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    capaBase64 = e.target.result;
                    await salvarVideo(titulo, embedUrl, capaBase64, descricao);
                };
                reader.readAsDataURL(capaInput.files[0]);
            } else {
                await salvarVideo(titulo, embedUrl, '', descricao);
            }
        }

        async function salvarVideo(titulo, url, capa, descricao) {
            const video = {
                title: titulo,
                url: url,
                thumbnail: capa,
                description: descricao || 'Sem descrição',
                author: usuarioAtual.name,
                authorEmail: usuarioAtual.email,
                date: new Date().toISOString(),
                views: 0
            };
            
            try {
                console.log("📤 Salvando:", video);
                const docRef = await db.collection('videos').add(video);
                console.log("✅ Salvo! ID:", docRef.id);
                
                alert('✅ Vídeo publicado com sucesso!');
                
                // Limpar formulário
                document.getElementById('titulo').value = '';
                document.getElementById('linkVideo').value = '';
                document.getElementById('descricao').value = '';
                document.getElementById('capa').value = '';
                
                // Recarregar lista
                carregarVideos();
                
            } catch (error) {
                console.error("❌ Erro:", error);
                alert('Erro ao publicar: ' + error.message);
            }
        }

        // Carregar vídeos
        async function carregarVideos() {
            try {
                const snapshot = await db.collection('videos').orderBy('date', 'desc').get();
                const videos = [];
                snapshot.forEach(doc => {
                    videos.push({ id: doc.id, ...doc.data() });
                });
                
                const div = document.getElementById('listaVideos');
                
                if (videos.length === 0) {
                    div.innerHTML = '<p>Nenhum vídeo ainda.</p>';
                    return;
                }
                
                div.innerHTML = videos.map(v => `
                    <div style="background: rgba(255,255,255,0.1); padding: 15px; margin-bottom: 15px; border-radius: 10px;">
                        <h3>${escapar(v.title)}</h3>
                        <p>👤 ${escapar(v.author)} | 👁️ ${v.views || 0} views</p>
                        <p>📅 ${new Date(v.date).toLocaleDateString()}</p>
                        <button onclick="abrirVideo('${v.id}')" style="background:#ff4757; padding:8px 15px;">▶ Assistir</button>
                        ${usuarioAtual && (usuarioAtual.email === v.authorEmail || usuarioAtual.type === 'admin') ? 
                            `<button onclick="excluirVideo('${v.id}')" style="background:#2c3e50; margin-left:10px;">🗑 Excluir</button>` : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('listaVideos').innerHTML = '<p>Erro ao carregar vídeos.</p>';
            }
        }

        async function abrirVideo(id) {
            try {
                const videoRef = db.collection('videos').doc(id);
                const video = await videoRef.get();
                
                if (!video.exists) {
                    alert('Vídeo não encontrado!');
                    return;
                }
                
                const data = video.data();
                const views = (data.views || 0) + 1;
                await videoRef.update({ views: views });
                
                window.open(data.url, '_blank');
            } catch (error) {
                alert('Erro ao abrir vídeo');
            }
        }

        async function excluirVideo(id) {
            if (confirm('Excluir este vídeo?')) {
                try {
                    await db.collection('videos').doc(id).delete();
                    alert('Vídeo excluído!');
                    carregarVideos();
                } catch (error) {
                    alert('Erro ao excluir');
                }
            }
        }

        function escapar(texto) {
            if (!texto) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // Verificar usuário salvo
        async function init() {
            await criarAdmin();
            
            const salvo = localStorage.getItem('usuario');
            if (salvo) {
                usuarioAtual = JSON.parse(salvo);
                if (usuarioAtual.type === 'creator' || usuarioAtual.type === 'admin') {
                    mostrarPublicar();
                } else {
                    mostrarLogin();
                }
            } else {
                mostrarLogin();
            }
            
            carregarVideos();
        }
        
        init();
    </script>
</body>
</html>
