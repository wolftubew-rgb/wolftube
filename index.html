<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfTube - Doação Segura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .donation-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        h1 i {
            color: #ff4757;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .pix-qr {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            display: inline-block;
        }
        .pix-qr img {
            width: 200px;
            height: 200px;
        }
        .pix-key {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
        }
        button {
            background: linear-gradient(135deg, #11c76f, #7fba00);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
            margin: 5px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .btn-copy {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
        }
        .btn-donate {
            background: linear-gradient(135deg, #11c76f, #7fba00);
        }
        .valor-sugerido {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .valor-sugerido:hover {
            background: #ff4757;
            transform: scale(1.05);
        }
        .valores {
            margin: 20px 0;
        }
        footer {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="donation-container">
        <div class="logo">
            🐺
        </div>
        <h1><i class="fas fa-heart"></i> Apoie o <span style="color: #ff4757;">Wolf</span>Tube</h1>
        <p>Sua doação ajuda a manter o site no ar e trazer mais conteúdo!</p>

        <!-- QR Code Pix (você precisa gerar o seu) -->
        <div class="pix-qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=00020126360014br.gov.bcb.pix0114seu-email@exemplo.com52040000530398654041.005802BR5917WolfTube6008BRASIL62070503***6304E2D3" alt="QR Code Pix">
        </div>

        <!-- Chave Pix -->
        <div class="pix-key" id="pixKey">
            seu-email@wolfTube.com
        </div>

        <!-- Botões de ação -->
        <button class="btn-copy" onclick="copiarPix()">
            📋 Copiar Chave Pix
        </button>
        <button class="btn-donate" onclick="baixarQrCode()">
                            ⬇️ Salvar QR Code
        </button>

        <!-- Valores sugeridos -->
        <div class="valores">
            <p style="margin-bottom: 10px;">💚 Valores sugeridos:</p>
            <span class="valor-sugerido" onclick="copiarComValor(5)">R$ 5</span>
            <span class="valor-sugerido" onclick="copiarComValor(10)">R$ 10</span>
            <span class="valor-sugerido" onclick="copiarComValor(20)">R$ 20</span>
            <span class="valor-sugerido" onclick="copiarComValor(50)">R$ 50</span>
            <span class="valor-sugerido" onclick="copiarComValor(100)">R$ 100</span>
        </div>

        <!-- Mensagem de agradecimento -->
        <div style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
            💚 Obrigado por apoiar o WolfTube!<br>
            Você estampado nos créditos do site!
        </div>
        <footer>
            🔒 Doação 100% segura via Pix • Seus dados estão protegidos
        </footer>
    </div>

    <script>
        // 🔥 ATENÇÃO: COLOQUE SUA CHAVE PIX AQUI 🔥
        // Pode ser: CPF, Email, Telefone ou Chave Aleatória
        const CHAVE_PIX = "seu-email@wolfTube.com";

        // Função para copiar a chave Pix
        function copiarPix() {
            navigator.clipboard.writeText(CHAVE_PIX);
            alert("✅ Chave Pix copiada!\n\n" + CHAVE_PIX + "\n\nAbra o app do seu banco, cole a chave e faça a doação.");
        }

        // Função para copiar Pix com valor sugerido
        function copiarComValor(valor) {
            // Gera uma mensagem personalizada
            const mensagem = `💚 Doação para WolfTube\nValor: R$ ${valor}\nChave Pix: ${CHAVE_PIX}`;
            navigator.clipboard.writeText(mensagem);
            alert(`✅ Informações para doar R$ ${valor} copiadas!\n\nChave: ${CHAVE_PIX}\n\nAbra o app do banco e faça a doação.`);
        }

        // Função para baixar o QR Code
        function baixarQrCode() {
            const qrImg = document.querySelector('.pix-qr img');
            const link = document.createElement('a');
            link.download = 'wolfTube-pix-qrcode.png';
            link.href = qrImg.src;
            link.click();
            alert("✅ QR Code salvo! Compartilhe com quem quiser doar.");
        }
    </script>
</body>
</html>
