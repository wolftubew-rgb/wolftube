<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WolfTube - Vídeos com Capa</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
        }
        .header {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #ff4757;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i { color: #ff4757; font-size: 32px; }
        .logo span:first-child { color: #ff4757; }
        .logo span:last-child { color: white; }
        .nav-buttons { display: flex; gap: 12px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #00b894, #00cec9); color: white; }
        .btn-danger { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .upload-area {
            background: linear-gradient(135deg, rgba(255,71,87,0.1), rgba(0,184,148,0.1));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .upload-area h2 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ff4757; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
        }
        .thumbnail-upload {
            border: 2px dashed rgba(255,71,87,0.5);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0,0,0,0.3);
        }
        .thumbnail-upload:hover { border-color: #ff4757; background: rgba(255,71,87,0.1); }
        .thumbnail-upload i { font-size: 48px; color: #ff4757; margin-bottom: 10px; }
        .thumbnail-preview { margin-top: 15px; position: relative; display: inline-block; }
        .thumbnail-preview img {
            max-width: 200px;
            max-height: 120px;
            border-radius: 10px;
            border: 2px solid #ff4757;
            object-fit: cover;
        }
        .remove-thumbnail {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff4757;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        .help-text { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 5px; }
        .videos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .sync-status {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .video-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-card:hover { transform: translateY(-10px); border-color: rgba(255,71,87,0.5); }
        .video-thumbnail {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-thumbnail::after {
            content: '▶';
            position: absolute;
            font-size: 48px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .video-card:hover .video-thumbnail::after { opacity: 0.9; }
        .video-info { padding: 20px; }
        .video-title { font-weight: bold; margin-bottom: 10px; font-size: 18px; color: #ff4757; }
        .video-meta { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 10px; }
        .video-meta i { margin-right: 5px; width: 20px; }
        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .video-container {
            background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            border: 2px solid rgba(255,71,87,0.3);
        }
        .video-header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .video-header h3 { color: #ff4757; }
        .close-video {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            cursor: pointer;
        }
        .video-wrapper iframe,
        .video-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            z-index: 10;
        }
        .play-overlay i {
            font-size: 64px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .video-info-modal { padding: 20px; }
        .video-info-modal p { margin: 5px 0; color: rgba(255,255,255,0.8); }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content, .login-box {
            background: linear-gradient(135deg, #1e1e2e, #2a2a3e);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
        }
        .hidden { display: none; }
        .alert {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .success { background: #00b894; color: white; }
        .error { background: #ff4757; color: white; }
        .delete-btn { margin-top: 10px; width: 100%; padding: 8px; font-size: 12px; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .videos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-wolf-pack-battalion"></i>
            <span>Wolf</span><span>Tube</span>
        </div>
        <div class="nav-buttons">
            <button class="btn-primary" onclick="showLoginModal()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none;"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
    </div>

    <div class="container">
        <div class="upload-area" id="uploadArea" style="display:none;">
            <h2><i class="fas fa-cloud-upload-alt"></i> Publicar Vídeo</h2>
            <div class="form-group">
                <label><i class="fas fa-heading"></i> Título</label>
                <input type="text" id="videoTitle" placeholder="Título do vídeo">
            </div>
            <div class="form-group">
                <label><i class="fas fa-images"></i> Capa do Vídeo (da galeria)</label>
                <div class="thumbnail-upload" onclick="document.getElementById('thumbnailInput').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>📸 Clique aqui para escolher uma foto da galeria</p>
                    <p style="font-size: 12px;">A foto escolhida vai ser a CAPA do vídeo</p>
                </div>
                <input type="file" id="thumbnailInput" accept="image/*" style="display: none;" onchange="previewThumbnail(this)">
                <div id="thumbnailPreviewContainer" style="display: none;" class="thumbnail-preview">
                    <img id="thumbnailPreview" src="">
                    <button class="remove-thumbnail" onclick="removeThumbnail()">✕</button>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fab fa-google-drive"></i> Link do Vídeo (Google Drive)</label>
                <input type="text" id="videoUrl" placeholder="https://drive.google.com/file/d/SEU_ID/view">
                <div class="help-text">📌 Cole o link do Google Drive do seu vídeo</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Descrição</label>
                <textarea id="videoDesc" rows="3" placeholder="Descrição do vídeo..."></textarea>
            </div>
            <button class="btn-primary" onclick="postVideo()"><i class="fas fa-paper-plane"></i> Publicar</button>
        </div>

        <div class="videos-header">
            <h2><i class="fas fa-video"></i> Vídeos</h2>
            <div class="sync-status" id="syncStatus"><i class="fas fa-sync-alt"></i> Carregando...</div>
        </div>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Modais -->
    <div class="modal" id="ageModal">
        <div class="modal-content">
            <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff4757;"></i>
            <h2>🔞 Verificação</h2>
            <p>Você tem 18 anos ou mais?</p>
            <button class="btn-primary" onclick="verifyAge(true)">✅ SIM</button>
            <button class="btn-danger" onclick="verifyAge(false)">❌ NÃO</button>
        </div>
    </div>

    <!-- Modal de Login - TODO MUNDO usa email + senha, mas senha só é verificada para admin -->
    <div class="modal hidden" id="loginModal">
        <div class="login-box">
            <i class="fas fa-user-circle" style="font-size: 48px; color: #ff4757;"></i>
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Senha (qualquer senha para usuário)">
            <button class="btn-primary" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
            <button class="btn-secondary" onclick="closeLoginModal()">Fechar</button>
        </div>
    </div>

    <div id="videoPlayerModal" class="video-modal hidden">
        <div class="video-container">
            <div class="video-header">
                <h3 id="modalVideoTitle">Título</h3>
                <button class="close-video" onclick="closeVideoModal()">✕</button>
            </div>
            <div class="video-wrapper" id="videoWrapper">
                <img id="videoThumbnailImg" src="" style="display: block;">
                <div class="play-overlay" id="playOverlay" onclick="playVideo()">
                    <i class="fas fa-play-circle"></i>
                </div>
                <iframe id="videoIframe" src="" frameborder="0" allowfullscreen style="display: none;"></iframe>
            </div>
            <div class="video-info-modal">
                <p><i class="fas fa-user"></i> <span id="modalAuthor"></span></p>
                <p><i class="fas fa-eye"></i> <span id="modalViews"></span> views</p>
                <p><i class="fas fa-align-left"></i> <span id="modalDescription"></span></p>
            </div>
        </div>
    </div>

    <script>
        let currentThumbnailBase64 = null;
        let currentVideoUrl = null;

        const firebaseConfig = {
            apiKey: "AIzaSyDakcmBAjmOQKQavFMpv1qWf4Xuqvhl0cY",
            authDomain: "wolftube-56e62.firebaseapp.com",
            projectId: "wolftube-56e62",
            storageBucket: "wolftube-56e62.firebasestorage.app",
            messagingSenderId: "251733558803",
            appId: "1:251733558803:web:e0be0827bafa6d8b6421e6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentUser = null;

        const ADMIN_EMAIL = "admin@wolftube.com";
        const ADMIN_PASSWORD = "wolfadmin2010";

        function previewThumbnail(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentThumbnailBase64 = e.target.result;
                    document.getElementById('thumbnailPreview').src = currentThumbnailBase64;
                    document.getElementById('thumbnailPreviewContainer').style.display = 'inline-block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeThumbnail() {
            currentThumbnailBase64 = null;
            document.getElementById('thumbnailPreviewContainer').style.display = 'none';
            document.getElementById('thumbnailPreview').src = '';
            document.getElementById('thumbnailInput').value = '';
        }

        function verifyAge(hasAge) {
            if (hasAge) {
                localStorage.setItem('ageVerified', 'true');
                document.getElementById('ageModal').style.display = 'none';
            } else {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h1>🔞 Acesso negado</h1></div>';
            }
        }

        if (!localStorage.getItem('ageVerified')) {
            document.getElementById('ageModal').style.display = 'flex';
        }

        // Login: admin verifica senha, usuário normal aceita qualquer senha
        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email) {
                showMessage('Digite seu email!', 'error');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                showMessage('Email inválido!', 'error');
                return;
            }
            
            // Verifica se é admin
            if (email === ADMIN_EMAIL) {
                // Admin precisa da senha correta
                if (password !== ADMIN_PASSWORD) {
                    showMessage('Senha de administrador incorreta!', 'error');
                    return;
                }
                currentUser = {
                    email: email,
                    name: 'Admin',
                    type: 'admin'
                };
            } else {
                // Usuário normal: qualquer senha funciona
                if (!password) {
                    showMessage('Digite uma senha! (qualquer senha serve)', 'error');
                    return;
                }
                const userName = email.split('@')[0];
                currentUser = {
                    email: email,
                    name: userName,
                    type: 'user'
                };
            }
            
            localStorage.setItem('wolftube_currentUser', JSON.stringify(currentUser));
            updateUI();
            closeLoginModal();
            showMessage(`Bem-vindo, ${currentUser.name}!`, 'success');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('wolftube_currentUser');
            updateUI();
            showMessage('Você saiu da conta.', 'success');
        }

        function updateUI() {
            const saved = localStorage.getItem('wolftube_currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
            }
            
            if (currentUser) {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'none';
                });
                document.getElementById('logoutBtn').style.display = 'inline-flex';
                document.getElementById('uploadArea').style.display = 'block';
            } else {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'inline-flex';
                });
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('uploadArea').style.display = 'none';
            }
        }

        function showLoginModal() { 
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginModal').classList.remove('hidden'); 
        }
        
        function closeLoginModal() { 
            document.getElementById('loginModal').classList.add('hidden'); 
        }

        async function postVideo() {
            const title = document.getElementById('videoTitle').value;
            let url = document.getElementById('videoUrl').value;
            const description = document.getElementById('videoDesc').value;
            
            if (!title || !url) {
                showMessage('Preencha título e link do vídeo!', 'error');
                return;
            }
            
            if (!currentUser) {
                showMessage('Faça login primeiro!', 'error');
                return;
            }
            
            let embedUrl = url;
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    fileId = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('id=')) {
                    fileId = url.split('id=')[1].split('&')[0];
                }
                if (fileId) embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
            }
            
            const novoVideo = {
                title: title,
                url: embedUrl,
                thumbnail: currentThumbnailBase64 || '',
                description: description || 'Sem descrição',
                author: currentUser.name,
                authorEmail: currentUser.email,
                date: new Date().toISOString(),
                views: 0
            };
            
            try {
                await db.collection('videos').add(novoVideo);
                showMessage('✅ Vídeo publicado!', 'success');
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('videoDesc').value = '';
                removeThumbnail();
                carregarVideos();
            } catch (error) {
                showMessage('Erro ao publicar: ' + error.message, 'error');
                console.error('Erro detalhado:', error);
            }
        }

        async function carregarVideos() {
            try {
                document.getElementById('syncStatus').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Carregando...';
                const snapshot = await db.collection('videos').orderBy('date', 'desc').get();
                const videos = [];
                snapshot.forEach(doc => {
                    videos.push({ 
                        docId: doc.id,
                        ...doc.data() 
                    });
                });
                exibirVideos(videos);
                document.getElementById('syncStatus').innerHTML = '<i class="fas fa-check-circle"></i> Sincronizado';
                setTimeout(() => {
                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-cloud"></i> Nuvem';
                }, 2000);
            } catch (error) {
                document.getElementById('syncStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
                console.error('Erro ao carregar:', error);
            }
        }

        function exibirVideos(videos) {
            const grid = document.getElementById('videosGrid');
            if (videos.length === 0) {
                grid.innerHTML = '<p style="text-align:center;">🎬 Nenhum vídeo ainda. Seja o primeiro a postar!</p>';
                return;
            }
            
            grid.innerHTML = videos.map(video => `
                <div class="video-card" onclick="openVideoModal('${video.docId}')">
                    <div class="video-thumbnail" style="background-image: url('${video.thumbnail || 'https://via.placeholder.com/320x200/ff4757/ffffff?text=WolfTube'}');">
                        ${!video.thumbnail ? '<i class="fas fa-play-circle"></i>' : ''}
                    </div>
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="video-meta">
                            <div><i class="fas fa-user"></i> ${escapeHtml(video.author)}</div>
                            <div><i class="fas fa-eye"></i> ${video.views || 0} views</div>
                        </div>
                        ${currentUser && (currentUser.email === video.authorEmail || currentUser.type === 'admin') ? 
                            `<button class="btn-danger delete-btn" onclick="event.stopPropagation(); deleteVideo('${video.docId}')">
                                <i class="fas fa-trash"></i> Excluir
                            </button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function openVideoModal(docId) {
            try {
                const videoRef = db.collection('videos').doc(docId);
                const video = await videoRef.get();
                
                if (!video.exists) {
                    showMessage('Vídeo não encontrado!', 'error');
                    return;
                }
                
                const videoData = video.data();
                
                const views = (videoData.views || 0) + 1;
                await videoRef.update({ views: views });
                
                document.getElementById('modalVideoTitle').textContent = videoData.title || 'Sem título';
                document.getElementById('modalAuthor').textContent = videoData.author || 'Desconhecido';
                document.getElementById('modalViews').textContent = views;
                document.getElementById('modalDescription').textContent = videoData.description || 'Sem descrição';
                
                const thumbnailImg = document.getElementById('videoThumbnailImg');
                const iframe = document.getElementById('videoIframe');
                const playOverlay = document.getElementById('playOverlay');
                
                currentVideoUrl = videoData.url;
                
                if (videoData.thumbnail && videoData.thumbnail !== '') {
                    thumbnailImg.style.display = 'block';
                    thumbnailImg.src = videoData.thumbnail;
                    iframe.style.display = 'none';
                    playOverlay.style.display = 'flex';
                } else {
                    thumbnailImg.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = videoData.url;
                    playOverlay.style.display = 'none';
                }
                
                document.getElementById('videoPlayerModal').classList.remove('hidden');
                
            } catch (error) {
                console.error('Erro detalhado:', error);
                showMessage('Erro ao carregar vídeo: ' + error.message, 'error');
            }
        }

        function playVideo() {
            const thumbnailImg = document.getElementById('videoThumbnailImg');
            const iframe = document.getElementById('videoIframe');
            const playOverlay = document.getElementById('playOverlay');
            
            thumbnailImg.style.display = 'none';
            iframe.style.display = 'block';
            playOverlay.style.display = 'none';
            iframe.src = currentVideoUrl;
        }

        function closeVideoModal() {
            document.getElementById('videoPlayerModal').classList.add('hidden');
            const iframe = document.getElementById('videoIframe');
            const thumbnailImg = document.getElementById('videoThumbnailImg');
            const playOverlay = document.getElementById('playOverlay');
            
            iframe.src = '';
            thumbnailImg.src = '';
            thumbnailImg.style.display = 'block';
            iframe.style.display = 'none';
            playOverlay.style.display = 'flex';
            currentVideoUrl = null;
        }

        async function deleteVideo(docId) {
            if (confirm('Excluir este vídeo?')) {
                try {
                    await db.collection('videos').doc(docId).delete();
                    showMessage('Vídeo excluído!', 'success');
                    carregarVideos();
                } catch (error) {
                    showMessage('Erro ao excluir: ' + error.message, 'error');
                }
            }
        }

        function showMessage(msg, type) {
            const div = document.createElement('div');
            div.className = `alert ${type}`;
            div.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        const savedUser = localStorage.getItem('wolftube_currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            updateUI();
        }
        carregarVideos();
    </script>
</body>
</html>
