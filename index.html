<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WolfTube - Upload de Vídeos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e74c3c;
        }
        .logo { font-size: 24px; font-weight: bold; color: #e74c3c; }
        .logo span { color: white; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: #e74c3c; color: white; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-danger { background: #2c3e50; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .upload-area {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .file-input {
            background: rgba(255,255,255,0.9);
            padding: 12px;
            border-radius: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #2c3e50;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .video-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .video-card:hover { transform: translateY(-5px); }
        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .video-info { padding: 15px; }
        .video-title { font-weight: bold; margin-bottom: 5px; }
        .video-meta { font-size: 12px; color: #ccc; margin-top: 8px; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content, .login-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .hidden { display: none; }
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            z-index: 999;
            animation: slideIn 0.3s ease;
        }
        .success { background: #27ae60; }
        .error { background: #e74c3c; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Wolf<span>Tube</span></div>
        <div class="nav-buttons">
            <button class="btn-primary" onclick="showLoginModal()">Entrar</button>
            <button class="btn-secondary" onclick="showRegisterModal()">Cadastrar</button>
            <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none;">Sair</button>
        </div>
    </div>

    <div class="container">
        <div class="upload-area" id="uploadArea" style="display:none;">
            <h2>📤 Postar Vídeo</h2>
            <div class="form-group">
                <label>Título do Vídeo</label>
                <input type="text" id="videoTitle" placeholder="Ex: Gameplay incrível">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="videoDesc" placeholder="Descreva seu vídeo..."></textarea>
            </div>
            <div class="form-group">
                <label>Selecionar Vídeo (Máx 200MB)</label>
                <input type="file" id="videoFile" accept="video/*" class="file-input">
            </div>
            <button class="btn-primary" onclick="uploadToGoFile()">📤 Publicar Vídeo</button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <h2>📺 Vídeos Recentes</h2>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Modal Idade -->
    <div class="modal" id="ageModal">
        <div class="modal-content">
            <h2>🔞 Verificação de Idade</h2>
            <p>Você tem 18 anos ou mais?</p>
            <button class="btn-primary" onclick="verifyAge(true)" style="margin-top:20px;">✅ SIM</button>
            <button class="btn-danger" onclick="verifyAge(false)">❌ NÃO</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal hidden" id="loginModal">
        <div class="login-box">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Senha">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
            <button class="btn-secondary" onclick="closeLoginModal()">Fechar</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal hidden" id="registerModal">
        <div class="login-box">
            <h2>Cadastro</h2>
            <input type="text" id="regName" placeholder="Nome">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Senha">
            <select id="regType">
                <option value="user">Usuário Comum</option>
                <option value="creator">Criador de Conteúdo</option>
            </select>
            <button class="btn-primary" onclick="doRegister()">Cadastrar</button>
            <button class="btn-secondary" onclick="closeRegisterModal()">Fechar</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        function verifyAge(hasAge) {
            if (hasAge) {
                localStorage.setItem('ageVerified', 'true');
                document.getElementById('ageModal').style.display = 'none';
            } else {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h1>🔞 Acesso negado</h1></div>';
            }
        }

        if (!localStorage.getItem('ageVerified')) {
            document.getElementById('ageModal').style.display = 'flex';
        }

        function loadUsers() {
            if (!localStorage.getItem('wolftube_users')) {
                localStorage.setItem('wolftube_users', JSON.stringify([
                    { email: 'admin@wolftube.com', password: 'wolfadmin2010', name: 'Admin', type: 'admin' }
                ]));
            }
        }
        loadUsers();

        function showLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function showRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('wolftube_currentUser', JSON.stringify(user));
                updateUI();
                closeLoginModal();
                showMessage(`Bem-vindo, ${user.name}!`, 'success');
                loadVideos();
            } else {
                showMessage('Email ou senha incorretos!', 'error');
            }
        }

        function doRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const type = document.getElementById('regType').value;
            
            if (!name || !email || !password) {
                showMessage('Preencha todos os campos!', 'error');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            if (users.find(u => u.email === email)) {
                showMessage('Email já cadastrado!', 'error');
                return;
            }
            
            users.push({ name, email, password, type });
            localStorage.setItem('wolftube_users', JSON.stringify(users));
            showMessage('Cadastro realizado! Faça login.', 'success');
            closeRegisterModal();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('wolftube_currentUser');
            updateUI();
            loadVideos();
            showMessage('Você saiu da conta.', 'success');
        }

        function updateUI() {
            const saved = localStorage.getItem('wolftube_currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
            }
            
            if (currentUser) {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'none';
                });
                document.getElementById('logoutBtn').style.display = 'inline-block';
                
                if (currentUser.type === 'creator' || currentUser.type === 'admin') {
                    document.getElementById('uploadArea').style.display = 'block';
                } else {
                    document.getElementById('uploadArea').style.display = 'none';
                }
            } else {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'inline-block';
                });
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('uploadArea').style.display = 'none';
            }
        }

        async function uploadToGoFile() {
            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDesc').value;
            const fileInput = document.getElementById('videoFile');

            if (!title || !description || !fileInput.files[0]) {
                showMessage('Preencha todos os campos e selecione um vídeo!', 'error');
                return;
            }

            if (!currentUser || (currentUser.type !== 'creator' && currentUser.type !== 'admin')) {
                showMessage('Apenas criadores podem postar vídeos!', 'error');
                return;
            }

            const videoFile = fileInput.files[0];
            
            if (videoFile.size > 200 * 1024 * 1024) {
                showMessage('Vídeo muito grande! Máximo 200MB', 'error');
                return;
            }

            document.getElementById('progressBar').style.display = 'block';
            updateProgress(0);

            const formData = new FormData();
            formData.append('file', videoFile);

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://store1.gofile.io/uploadFile');
                
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        updateProgress(percent);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        if (response.status === 'ok') {
                            const videoUrl = response.data.downloadPage;
                            
                            const videoData = {
                                id: Date.now(),
                                title: title,
                                description: description,
                                url: videoUrl,
                                author: currentUser.name,
                                authorEmail: currentUser.email,
                                date: new Date().toISOString(),
                                views: 0
                            };
                            
                            saveVideo(videoData);
                            showMessage('✅ Vídeo publicado com sucesso!', 'success');
                            clearUploadForm();
                            loadVideos();
                        } else {
                            showMessage('Erro no upload', 'error');
                        }
                    } else {
                        showMessage('Erro no upload. Tente novamente.', 'error');
                    }
                    document.getElementById('progressBar').style.display = 'none';
                };

                xhr.onerror = () => {
                    showMessage('Erro de rede. Tente novamente.', 'error');
                    document.getElementById('progressBar').style.display = 'none';
                };

                xhr.send(formData);
                
            } catch (error) {
                showMessage('Erro: ' + error.message, 'error');
                document.getElementById('progressBar').style.display = 'none';
            }
        }

        function updateProgress(percent) {
            const fill = document.getElementById('progressFill');
            fill.style.width = percent + '%';
            fill.textContent = Math.round(percent) + '%';
        }

        function showMessage(msg, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert ${type}`;
            messageDiv.textContent = msg;
            document.body.appendChild(messageDiv);
            setTimeout(() => messageDiv.remove(), 3000);
        }

        function saveVideo(video) {
            let videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
            videos.unshift(video);
            localStorage.setItem('wolftube_videos', JSON.stringify(videos));
        }

        function loadVideos() {
            const videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
            const grid = document.getElementById('videosGrid');
            
            if (videos.length === 0) {
                grid.innerHTML = '<p style="text-align:center;">🎬 Nenhum vídeo ainda. Seja o primeiro a postar!</p>';
                return;
            }
            
            grid.innerHTML = videos.map(video => `
                <div class="video-card" onclick="watchVideo('${video.url}', '${video.id}')">
                    <div class="video-thumbnail">🎬</div>
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="video-meta">
                            👤 ${escapeHtml(video.author)}<br>
                            👁️ ${video.views} views<br>
                            📅 ${new Date(video.date).toLocaleDateString('pt-BR')}
                        </div>
                        ${currentUser && (currentUser.email === video.authorEmail || currentUser.type === 'admin') ? 
                            `<button class="btn-danger" onclick="event.stopPropagation(); deleteVideo('${video.id}')" style="margin-top:10px;">🗑️ Excluir</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function watchVideo(url, videoId) {
            let videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
            const videoIndex = videos.findIndex(v => v.id == videoId);
            if (videoIndex !== -1) {
                videos[videoIndex].views++;
                localStorage.setItem('wolftube_videos', JSON.stringify(videos));
            }
            window.open(url, '_blank');
        }

        function deleteVideo(videoId) {
            if (confirm('Tem certeza que quer excluir este vídeo?')) {
                let videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
                videos = videos.filter(v => v.id != videoId);
                localStorage.setItem('wolftube_videos', JSON.stringify(videos));
                loadVideos();
                showMessage('Vídeo excluído!', 'success');
            }
        }

        function clearUploadForm() {
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoDesc').value = '';
            document.getElementById('videoFile').value = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        const savedUser = localStorage.getItem('wolftube_currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            updateUI();
        }
        loadVideos();
    </script>
</body>
</html>
