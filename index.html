<!DOCTYPE html>
<html>
<head>
    <title>WolfTube</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        button { background: #e74c3c; color: white; padding: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🐺 WolfTube</h1>
    
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="senha" placeholder="Senha"><br><br>
    <button onclick="login()">Entrar</button>
    
    <div id="areaPost" style="display:none;">
        <h2>Postar Vídeo</h2>
        <input type="text" id="titulo" placeholder="Título"><br><br>
        <input type="text" id="link" placeholder="Link do YouTube"><br><br>
        <button onclick="postar()">Publicar</button>
    </div>
    
    <h2>Vídeos</h2>
    <div id="videos"></div>

    <script>
        let usuario = null;
        
        function login() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            if(email === 'admin@wolftube.com' && senha === 'wolfadmin2010') {
                usuario = {nome: 'Admin', tipo: 'admin'};
                document.getElementById('areaPost').style.display = 'block';
                alert('Login OK!');
            } else {
                alert('Email ou senha errados! Use admin@wolftube.com / wolfadmin2010');
            }
        }
        
        function postar() {
            const titulo = document.getElementById('titulo').value;
            const link = document.getElementById('link').value;
            
            if(!titulo || !link) {
                alert('Preencha tudo!');
                return;
            }
            
            let videos = JSON.parse(localStorage.getItem('videos') || '[]');
            videos.push({
                id: Date.now(),
                titulo: titulo,
                link: link
            });
            localStorage.setItem('videos', JSON.stringify(videos));
            alert('Vídeo postado!');
            carregarVideos();
        }
        
        function carregarVideos() {
            const videos = JSON.parse(localStorage.getItem('videos') || '[]');
            const div = document.getElementById('videos');
            div.innerHTML = videos.map(v => `
                <div onclick="window.open('${v.link}', '_blank')" style="background:#2c3e50; margin:10px; padding:10px; cursor:pointer;">
                    <b>${v.titulo}</b><br>
                    Clique para assistir
                </div>
            `).join('');
        }
        
        carregarVideos();
    </script>
</body>
</html>
