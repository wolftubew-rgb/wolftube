<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfTube - Upload Simplificado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e74c3c;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }

        .logo span { color: white; }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background: #e74c3c; color: white; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-danger { background: #2c3e50; color: white; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .video-card:hover { transform: translateY(-5px); }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .video-info { padding: 15px; }
        .video-title { font-weight: bold; margin-bottom: 5px; }
        .video-meta { font-size: 12px; color: #ccc; margin-top: 8px; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content, .login-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Wolf<span>Tube</span></div>
        <div class="nav-buttons">
            <button class="btn-primary" onclick="showLoginModal()">Entrar</button>
            <button class="btn-secondary" onclick="showRegisterModal()">Cadastrar</button>
            <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none;">Sair</button>
        </div>
    </div>

    <div class="container">
        <div class="upload-area" id="uploadArea" style="display:none;">
            <h2>📤 Postar Vídeo</h2>
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="videoTitle" placeholder="Título do vídeo">
            </div>
            <div class="form-group">
                <label>Link do Vídeo (YouTube ou Google Drive)</label>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=... ou https://drive.google.com/...">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="videoDesc" placeholder="Descrição..."></textarea>
            </div>
            <button class="btn-primary" onclick="postVideo()">📤 Publicar</button>
        </div>

        <h2>📺 Vídeos Recentes</h2>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Modal Idade -->
    <div class="modal" id="ageModal">
        <div class="modal-content">
            <h2>🔞 Verificação de Idade</h2>
            <p>Você tem 18 anos ou mais?</p>
            <button class="btn-primary" onclick="verifyAge(true)">✅ SIM</button>
            <button class="btn-danger" onclick="verifyAge(false)">❌ NÃO</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal hidden" id="loginModal">
        <div class="login-box">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Senha">
            <button class="btn-primary" onclick="doLogin()">Entrar</button>
            <button class="btn-secondary" onclick="closeLoginModal()">Fechar</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal hidden" id="registerModal">
        <div class="login-box">
            <h2>Cadastro</h2>
            <input type="text" id="regName" placeholder="Nome">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Senha">
            <select id="regType">
                <option value="user">Usuário</option>
                <option value="creator">Criador</option>
            </select>
            <button class="btn-primary" onclick="doRegister()">Cadastrar</button>
            <button class="btn-secondary" onclick="closeRegisterModal()">Fechar</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Verificar idade
        function verifyAge(hasAge) {
            if (hasAge) {
                localStorage.setItem('ageVerified', 'true');
                document.getElementById('ageModal').style.display = 'none';
            } else {
                document.body.innerHTML = '<h1 style="text-align:center;margin-top:50px;">🔞 Acesso negado</h1>';
            }
        }

        if (!localStorage.getItem('ageVerified')) {
            document.getElementById('ageModal').style.display = 'flex';
        }

        // Sistema de usuários
        function loadUsers() {
            if (!localStorage.getItem('wolftube_users')) {
                localStorage.setItem('wolftube_users', JSON.stringify([
                    { email: 'admin@wolftube.com', password: 'wolfadmin2010', name: 'Admin', type: 'admin' }
                ]));
            }
        }
        loadUsers();

        function showLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function showRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('wolftube_currentUser', JSON.stringify(user));
                updateUI();
                closeLoginModal();
                alert(`Bem-vindo, ${user.name}!`);
                loadVideos();
            } else {
                alert('Email ou senha incorretos!');
            }
        }

        function doRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const type = document.getElementById('regType').value;
            
            if (!name || !email || !password) {
                alert('Preencha todos os campos!');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('wolftube_users'));
            if (users.find(u => u.email === email)) {
                alert('Email já cadastrado!');
                return;
            }
            
            users.push({ name, email, password, type });
            localStorage.setItem('wolftube_users', JSON.stringify(users));
            alert('Cadastro realizado! Faça login.');
            closeRegisterModal();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('wolftube_currentUser');
            updateUI();
            loadVideos();
        }

        function updateUI() {
            const saved = localStorage.getItem('wolftube_currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
            }
            
            if (currentUser) {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'none';
                });
                document.getElementById('logoutBtn').style.display = 'inline-block';
                
                if (currentUser.type === 'creator' || currentUser.type === 'admin') {
                    document.getElementById('uploadArea').style.display = 'block';
                }
            } else {
                document.querySelectorAll('.nav-buttons button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'inline-block';
                });
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('uploadArea').style.display = 'none';
            }
        }

        // Vídeos
        function postVideo() {
            const title = document.getElementById('videoTitle').value;
            const url = document.getElementById('videoUrl').value;
            const description = document.getElementById('videoDesc').value;
            
            if (!title || !url) {
                alert('Preencha título e link do vídeo!');
                return;
            }
            
            // Converter link do YouTube para embed
            let embedUrl = url;
            if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1].split('&')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (url.includes('youtu.be/')) {
                const videoId = url.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}`;
            }
            
            const video = {
                id: Date.now(),
                title,
                url: embedUrl,
                originalUrl: url,
                description,
                author: currentUser.name,
                authorEmail: currentUser.email,
                date: new Date().toISOString(),
                views: 0
            };
            
            const videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
            videos.unshift(video);
            localStorage.setItem('wolftube_videos', JSON.stringify(videos));
            
            alert('Vídeo publicado!');
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('videoDesc').value = '';
            loadVideos();
        }

        function loadVideos() {
            const videos = JSON.parse(localStorage.getItem('wolftube_videos') || '[]');
            const grid = document.getElementById('videosGrid');
            
            if (videos.length === 0) {
                grid.innerHTML = '<p>Nenhum vídeo ainda. Poste o primeiro!</p>';
                return;
            }
            
            grid.innerHTML = videos.map(video => `
                <div class="video-card" onclick="watchVideo('${video.url}')">
                    <div class="video-thumbnail">🎬</div>
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="video-meta">
                            👤 ${escapeHtml(video.author)}<br>
                            👁️ ${video.views} views<br>
                            📅 ${new Date(video.date).toLocaleDateString()}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function watchVideo(url) {
            window.open(url, '_blank');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Carregar dados salvos
        const savedUser = localStorage.getItem('wolftube_currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            updateUI();
        }
        loadVideos();
    </script>
</body>
</html>
