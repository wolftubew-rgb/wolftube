<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WolfTube - Upload Vídeo</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #ff4757;
        }
        .logo { font-size: 32px; color: #ff4757; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-primary { background: #ff4757; color: white; }
        .btn-secondary { background: #00b894; color: white; }
        .btn-danger { background: #2c3e50; color: white; }
        .upload-area {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
        }
        .video-preview { margin-top: 15px; text-align: center; }
        .video-preview video { max-width: 100%; max-height: 200px; border-radius: 10px; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff4757;
            border-radius: 5px;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .video-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
        }
        .video-card:hover { background: rgba(255,255,255,0.2); }
        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content, .login-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .hidden { display: none; }
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
        }
        .success { background: #00b894; }
        .error { background: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><i class="fas fa-wolf-pack-battalion"></i> WolfTube</div>
            <div>
                <button class="btn-primary" onclick="showLogin()">Entrar</button>
                <button class="btn-secondary" onclick="showRegister()">Cadastrar</button>
                <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none;">Sair</button>
            </div>
        </div>

        <div id="uploadArea" class="upload-area" style="display:none;">
            <h3>Publicar Vídeo</h3>
            <input type="text" id="titulo" placeholder="Título do vídeo">
            <div class="video-upload" onclick="document.getElementById('videoFile').click()" style="border: 2px dashed #ff4757; padding: 40px; text-align: center; cursor: pointer; border-radius: 10px;">
                <i class="fas fa-cloud-upload-alt" style="font-size: 48px;"></i>
                <p>Clique para escolher um vídeo da galeria</p>
            </div>
            <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="previewVideo(this)">
            <div id="previewContainer" class="video-preview" style="display:none">
                <video id="videoPreview" controls></video>
                <button onclick="removerVideo()" style="background:#ff4757; margin-top:5px;">Remover</button>
            </div>
            <textarea id="descricao" rows="3" placeholder="Descrição..."></textarea>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <button class="btn-primary" id="publicarBtn" onclick="publicarVideo()" style="width:100%; margin-top:10px;">Publicar</button>
        </div>

        <h3>Vídeos Recentes</h3>
        <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- Modais -->
    <div id="loginModal" class="modal hidden">
        <div class="login-box">
            <h3>Login</h3>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Senha">
            <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
            <button class="btn-secondary" onclick="fecharLogin()">Fechar</button>
        </div>
    </div>

    <div id="registerModal" class="modal hidden">
        <div class="login-box">
            <h3>Cadastro</h3>
            <input type="text" id="regNome" placeholder="Nome">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regSenha" placeholder="Senha">
            <select id="regTipo">
                <option value="user">Usuário</option>
                <option value="creator">Criador</option>
            </select>
            <button class="btn-primary" onclick="fazerCadastro()">Cadastrar</button>
            <button class="btn-secondary" onclick="fecharCadastro()">Fechar</button>
        </div>
    </div>

    <div id="videoModal" class="modal hidden">
        <div class="login-box" style="max-width: 600px;">
            <h3 id="modalTitulo"></h3>
            <video id="modalVideo" controls style="width:100%; max-height: 400px;"></video>
            <p><i class="fas fa-user"></i> <span id="modalAutor"></span></p>
            <p><i class="fas fa-eye"></i> <span id="modalViews"></span> views</p>
            <p id="modalDescricao"></p>
            <button class="btn-secondary" onclick="fecharVideo()">Fechar</button>
        </div>
    </div>

    <script>
        let videoArquivo = null;
        let usuarioAtual = null;

        const firebaseConfig = {
            apiKey: "AIzaSyDakcmBAjmOQKQavFMpv1qWf4Xuqvhl0cY",
            authDomain: "wolftube-56e62.firebaseapp.com",
            projectId: "wolftube-56e62",
            storageBucket: "wolftube-56e62.firebasestorage.app",
            messagingSenderId: "251733558803",
            appId: "1:251733558803:web:e0be0827bafa6d8b6421e6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Carregar usuários
        function carregarUsuarios() {
            if (!localStorage.getItem('usuarios')) {
                localStorage.setItem('usuarios', JSON.stringify([
                    { email: 'admin@wolftube.com', senha: 'wolfadmin2010', nome: 'Admin', tipo: 'admin' }
                ]));
            }
        }
        carregarUsuarios();

        // Verificar idade
        if (!localStorage.getItem('idadeVerificada')) {
            if (confirm('Você tem 18 anos ou mais?')) {
                localStorage.setItem('idadeVerificada', 'true');
            } else {
                document.body.innerHTML = '<h1 style="text-align:center; padding:50px;">Acesso Negado</h1>';
            }
        }

        function mostrarMensagem(msg, tipo) {
            const div = document.createElement('div');
            div.className = `alert ${tipo}`;
            div.innerHTML = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function showLogin() { document.getElementById('loginModal').classList.remove('hidden'); }
        function fecharLogin() { document.getElementById('loginModal').classList.add('hidden'); }
        function showRegister() { document.getElementById('registerModal').classList.remove('hidden'); }
        function fecharCadastro() { document.getElementById('registerModal').classList.add('hidden'); }

        function fazerLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginPassword').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios'));
            const user = usuarios.find(u => u.email === email && u.senha === senha);
            
            if (user) {
                usuarioAtual = user;
                localStorage.setItem('usuarioAtual', JSON.stringify(user));
                document.getElementById('uploadArea').style.display = 'block';
                document.querySelectorAll('.header button').forEach(btn => {
                    if (btn.id !== 'logoutBtn') btn.style.display = 'none';
                });
                document.getElementById('logoutBtn').style.display = 'inline-block';
                fecharLogin();
                mostrarMensagem(`Bem-vindo, ${user.nome}!`, 'success');
                carregarVideos();
            } else {
                mostrarMensagem('Email ou senha incorretos!', 'error');
            }
        }

        function fazerCadastro() {
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;
            const tipo = document.getElementById('regTipo').value;
            
            if (!nome || !email || !senha) {
                mostrarMensagem('Preencha todos os campos!', 'error');
                return;
            }
            
            const usuarios = JSON.parse(localStorage.getItem('usuarios'));
            if (usuarios.find(u => u.email === email)) {
                mostrarMensagem('Email já cadastrado!', 'error');
                return;
            }
            
            usuarios.push({ nome, email, senha, tipo });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            mostrarMensagem('Cadastro realizado! Faça login.', 'success');
            fecharCadastro();
        }

        function logout() {
            usuarioAtual = null;
            localStorage.removeItem('usuarioAtual');
            document.getElementById('uploadArea').style.display = 'none';
            document.querySelectorAll('.header button').forEach(btn => {
                if (btn.id !== 'logoutBtn') btn.style.display = 'inline-block';
            });
            document.getElementById('logoutBtn').style.display = 'none';
            mostrarMensagem('Você saiu da conta.', 'success');
            carregarVideos();
        }

        function previewVideo(input) {
            if (input.files && input.files[0]) {
                videoArquivo = input.files[0];
                const url = URL.createObjectURL(videoArquivo);
                const videoPreview = document.getElementById('videoPreview');
                videoPreview.src = url;
                document.getElementById('previewContainer').style.display = 'block';
            }
        }

        function removerVideo() {
            videoArquivo = null;
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('videoPreview').src = '';
            document.getElementById('videoFile').value = '';
        }

        async function publicarVideo() {
            const titulo = document.getElementById('titulo').value;
            const descricao = document.getElementById('descricao').value;
            
            if (!titulo || !videoArquivo) {
                mostrarMensagem('Preencha título e escolha um vídeo!', 'error');
                return;
            }
            
            if (!usuarioAtual || (usuarioAtual.tipo !== 'creator' && usuarioAtual.tipo !== 'admin')) {
                mostrarMensagem('Apenas criadores podem postar vídeos!', 'error');
                return;
            }
            
            const botao = document.getElementById('publicarBtn');
            botao.disabled = true;
            botao.innerHTML = 'Enviando...';
            
            try {
                const id = Date.now();
                const videoRef = storage.ref(`videos/${id}`);
                const uploadTask = videoRef.put(videoArquivo);
                
                document.getElementById('progressBar').style.display = 'block';
                
                const snapshot = await new Promise((resolve, reject) => {
                    uploadTask.on('state_changed',
                        (snapshot) => {
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            document.getElementById('progressFill').style.width = progress + '%';
                        },
                        reject,
                        () => resolve(uploadTask.snapshot)
                    );
                });
                
                const urlVideo = await snapshot.ref.getDownloadURL();
                
                await db.collection('videos').add({
                    titulo: titulo,
                    url: urlVideo,
                    descricao: descricao || 'Sem descrição',
                    autor: usuarioAtual.nome,
                    autorEmail: usuarioAtual.email,
                    data: new Date().toISOString(),
                    views: 0
                });
                
                mostrarMensagem('✅ Vídeo publicado!', 'success');
                document.getElementById('titulo').value = '';
                document.getElementById('descricao').value = '';
                removerVideo();
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressBar').style.display = 'none';
                carregarVideos();
            } catch (error) {
                mostrarMensagem('Erro: ' + error.message, 'error');
                document.getElementById('progressBar').style.display = 'none';
            } finally {
                botao.disabled = false;
                botao.innerHTML = 'Publicar';
            }
        }

        async function carregarVideos() {
            try {
                const snapshot = await db.collection('videos').orderBy('data', 'desc').get();
                const videos = [];
                snapshot.forEach(doc => videos.push({ id: doc.id, ...doc.data() }));
                
                const grid = document.getElementById('videosGrid');
                if (videos.length === 0) {
                    grid.innerHTML = '<p style="text-align:center;">Nenhum vídeo ainda</p>';
                    return;
                }
                
                grid.innerHTML = videos.map(video => `
                    <div class="video-card" onclick="abrirVideo('${video.id}')">
                        <div class="video-thumbnail">
                            <i class="fas fa-play-circle"></i>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${escapeHtml(video.titulo)}</div>
                            <div><i class="fas fa-user"></i> ${escapeHtml(video.autor)}</div>
                            <div><i class="fas fa-eye"></i> ${video.views || 0} views</div>
                            ${usuarioAtual && (usuarioAtual.email === video.autorEmail || usuarioAtual.tipo === 'admin') ? 
                                `<button class="btn-danger" style="margin-top:10px; width:100%" onclick="event.stopPropagation(); excluirVideo('${video.id}')">Excluir</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
            }
        }

        async function abrirVideo(videoId) {
            try {
                const videoRef = db.collection('videos').doc(videoId);
                const video = await videoRef.get();
                
                if (!video.exists) {
                    mostrarMensagem('Vídeo não encontrado!', 'error');
                    return;
                }
                
                const data = video.data();
                const viewsAtual = data.views || 0;
                await videoRef.update({ views: viewsAtual + 1 });
                
                document.getElementById('modalTitulo').innerHTML = data.titulo;
                document.getElementById('modalAutor').innerHTML = data.autor;
                document.getElementById('modalViews').innerHTML = viewsAtual + 1;
                document.getElementById('modalDescricao').innerHTML = data.descricao;
                
                const modalVideo = document.getElementById('modalVideo');
                modalVideo.src = data.url;
                modalVideo.load();
                
                document.getElementById('videoModal').classList.remove('hidden');
            } catch (error) {
                mostrarMensagem('Erro ao abrir vídeo', 'error');
            }
        }

        function fecharVideo() {
            document.getElementById('videoModal').classList.add('hidden');
            const video = document.getElementById('modalVideo');
            video.pause();
            video.src = '';
        }

        async function excluirVideo(videoId) {
            if (confirm('Excluir este vídeo?')) {
                try {
                    await db.collection('videos').doc(videoId).delete();
                    mostrarMensagem('Vídeo excluído!', 'success');
                    carregarVideos();
                } catch (error) {
                    mostrarMensagem('Erro ao excluir', 'error');
                }
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Inicialização
        const usuarioSalvo = localStorage.getItem('usuarioAtual');
        if (usuarioSalvo) {
            usuarioAtual = JSON.parse(usuarioSalvo);
            document.getElementById('uploadArea').style.display = 'block';
            document.querySelectorAll('.header button').forEach(btn => {
                if (btn.id !== 'logoutBtn') btn.style.display = 'none';
            });
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }
        carregarVideos();
    </script>
</body>
</html>
